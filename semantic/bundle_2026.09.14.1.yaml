# ============================================================================
# 2. 指标定义（**唯一权威口径**）
# ============================================================================
# `default_binding`（07 §4.7.1 裁定：**采纳但收窄为 `{asset, reason}`**）：
# 该指标默认绑定的**资产**，以及 L3 命中该默认口径时**强制披露的文案**。
# L3 层的语义是「该概念已有默认口径，且无排他候选 → 直接执行 + 强制披露」。
# 对指标而言，最常缺的默认是「用哪张表」—— 用户问"GMV 多少"不会说"用 order_paid 算"。
#
# ⚠️ 原字段 `time_field` **已删**：它与本区块既有的 `time_basis` **重复**
#    （同一事实两处 → 必然漂移）。时间基准一律读 `time_basis`。
#    注意 `time_basis` 的语义不是"排他绑定"（`支付时间` 概念仍有 create_time 备选），
#    而是本指标口径所属的时间基准 —— 这正是本指标为什么是 L3 而非 L2。
# `reason` 的长度上限 **40 字**、渲染顺序（去重 → 字典序）见文件头 U-26 披露链路。
metrics:

  - name: gmv
    display_name: GMV
    domain: orders
    expression: "SUM(order_paid.pay_amount)"
    default_aggregation: sum
    unit: CNY
    owner: finance
    status: active
    definition_note: >
      口径：按支付完成时间（pay_time）统计；含运费；剔除全额退款订单；剔除测试单。
      与财务口径的差异仅在"部分退款"处理上 —— 本口径暂不扣减部分退款。
    default_binding:
      asset: order_paid
      reason: "GMV 的时间基准固定为 pay_time，而非 create_time"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["GMV", "gmv", "成交额", "销售额", "交易额", "成交金额", "流水"]
    created_at: "2026-09-14"
    version: 1

  - name: order_cnt
    display_name: 订单量
    domain: orders
    expression: "COUNT(DISTINCT order_paid.sub_order_id)"
    default_aggregation: count_distinct
    unit: 单
    owner: operations
    status: active
    definition_note: "按子订单计数（非父订单）；仅已支付、未取消、未全额退款。"
    default_binding:
      asset: order_paid
      reason: "订单量同为交易口径，与 GMV 共用时间基准"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["订单量", "单量", "订单数", "成交单量", "出单量"]
    created_at: "2026-09-14"
    version: 1

  - name: aov
    display_name: 客单价
    domain: orders
    expression: "SUM(order_paid.pay_amount) / NULLIF(COUNT(DISTINCT order_paid.sub_order_id), 0)"
    default_aggregation: ratio_of_sums
    unit: CNY
    owner: operations
    status: active
    definition_note: >
      ⚠️ 高危口径。分母 = **支付子订单数**（非买家数、非父订单数）。
      若业务需要"人均消费"，应使用独立指标 arpu，**不要复用 aov**。
      ⚠️ "件单价"（pay_amount / quantity）**不是** aov → 见 blacklist_terms。
    default_binding:
      asset: order_paid
      reason: "客单价属交易口径"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["客单价", "平均订单金额", "AOV"]
    created_at: "2026-09-14"
    version: 1

  - name: arpu
    display_name: 人均消费
    domain: orders
    expression: "SUM(order_paid.pay_amount) / NULLIF(COUNT(DISTINCT order_paid.buyer_id), 0)"
    default_aggregation: ratio_of_sums
    unit: CNY
    owner: operations
    status: active
    definition_note: "分母 = 去重买家数。与 aov **不可混用**。"
    default_binding:
      asset: order_paid
      reason: "人均消费属交易口径"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["人均消费", "人均产出", "ARPU"]
    created_at: "2026-09-14"
    version: 1

  - name: refund_rate
    display_name: 退款率
    domain: orders
    expression: >
      SUM(CASE WHEN order_paid.refund_status = 'refunded' THEN order_paid.pay_amount ELSE 0 END)
      / NULLIF(SUM(order_paid.pay_amount), 0)
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: finance
    status: active
    definition_note: "**按金额、按退款完成**。若要按单量口径，须另立 refund_rate_qty（P1）。"
    # ⚠️ 本指标的谓词**不含** `refund_status <> 'refunded'` —— 分子正是靠退款行为算出来的。
    default_predicates:
      - "pay_status = 'paid'"
      - "is_test_order = false"
    default_binding:
      asset: order_paid
      reason: "退款率以支付订单为分母，时间随分母"
    time_basis: pay_time
    synonyms: ["退款率", "退货率", "退款占比"]
    created_at: "2026-09-14"
    version: 1

  - name: repurchase_rate_90d
    display_name: 90天复购率
    domain: orders
    expression: >
      COUNT(DISTINCT CASE WHEN cnt >= 2 THEN buyer_id END)
      / NULLIF(COUNT(DISTINCT buyer_id), 0)
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: operations
    status: active
    window: "90 days"
    definition_note: "90 天内购买 ≥ 2 次；**不含首单口径**。周期固定 90 天，不接受运行时改窗口。"
    default_predicates:
      - "pay_status = 'paid'"
      - "is_test_order = false"
    default_binding:
      asset: order_paid
      reason: "复购窗口以支付时间为基准"
    time_basis: pay_time
    synonyms: ["复购率", "回购率", "复购"]
    created_at: "2026-09-14"
    version: 1

  - name: uv
    display_name: UV
    domain: traffic
    expression: "SUM(traffic_daily.uv)"
    default_aggregation: sum
    unit: 人
    owner: operations
    status: active
    definition_note: >
      按用户去重、**自然日窗口**。跨日直接累加会重复计数 ——
      跨日区间应使用独立口径 uv_period（P1，本包未定义 → 未定义的指标**不得被生成**）。
    default_predicates:
      - "uv >= 0"
    default_binding:
      asset: traffic_daily
      reason: "流量表的时间基准是 stat_date（date 型），不是 pay_time"
    time_basis: stat_date
    synonyms: ["UV", "uv", "访客数", "独立访客"]
    created_at: "2026-09-14"
    version: 1

  - name: pay_cvr
    display_name: 支付转化率
    domain: traffic
    expression: "SUM(traffic_daily.order_cnt) * 1.0 / NULLIF(SUM(traffic_daily.uv), 0)"
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: operations
    status: active
    definition_note: "**支付**转化（非下单转化），分母为 UV。转化率不落成列，只在此定义。"
    default_predicates:
      - "uv >= 0"
    default_binding:
      asset: traffic_daily
      reason: "转化率的分母是流量，时间随 UV"
    time_basis: stat_date
    synonyms: ["转化率", "支付转化率", "CVR", "成交转化", "转化"]
    created_at: "2026-09-14"
    version: 1

  - name: sell_through_rate
    display_name: 动销率
    domain: products
    status: draft                      # ⚠️ draft 状态**不可被检索使用**（07 §6.1 版本状态机）
    definition_note: "口径待业务确认（观察周期、分母是否含下架商品）。**确认前不对外开放**。"
    synonyms: ["动销率", "动销"]
    created_at: "2026-09-14"
    version: 0
    # ⚠️ 刻意**不设** expression / default_binding：draft 指标不参与 L3。
    # 若 draft 也带 default_binding，L3 会把它当成"有默认口径"而放行 —— 那正是
    # FR-12.3「禁止 LLM 自动发布语义」要防的事。

# ============================================================================
# 3. 维度与层级
# ============================================================================
# `grain_levels`（07 §4.7.1 已裁定采纳）：层级名 → 细度值 的映射。
#   契约：**族内刻度**（绝对值无跨族意义）；必须与 `hierarchy` **逐项对应**且**严格递增**
#   （校验器断言）。供 L2 的「粒度词抽取 → 查表」使用（07 §6.8.1：「抽取失败 → 不进入 L2」）。
#   ⚠️ L2 判"是否同粒度"用 **数值相等**，**不得用 `hierarchy` 数组下标**。
#
# `grain_level`（07 §4.7.1 已裁定采纳）：该维度的**默认细度**，数值，**1 = 最粗**。
#   ⚠️ **本文件采用的读法**：默认层级 ≡ `hierarchy` 的**最后一层**（因 `hierarchy` 随
#      `grain_levels` 严格递增，它等价于"该维度可表达的最细层级"）。校验器据此断言：
#        `grain_level == grain_levels[hierarchy[-1]]`   （防漂移）
#   ⚠️ **残留口径待确认（属已裁定的 U-23，不是新问题）**：07 §4.7.1 的定义是「问句未给
#      粒度词时的默认粒度」。若架构窗口要的是"**`binding` 所在层级**"这一读法，则
#        `region`（binding=region_code，省）应为 3、`category`（binding=category_l1）应为 1，
#      而这两个当前分别是 4 / 3。**本文件不擅自改，也不擅自新增 `default_level` 字段** ——
#      因为那会让"默认层级"变成一个需要落笔的**新字段**（附录 B 无承载位，属 U-34 范围）。
#      → 已由架构窗口知悉（W1A_HANDOVER §4.1 的"U-23 残留"行）。
#
dimensions:

  - name: region
    binding: order_paid.region_code
    hierarchy: [country, region, province, city]
    grain_levels: { country: 1, region: 2, province: 3, city: 4 }
    grain_level: 4                     # = grain_levels[hierarchy[-1]] = city（见上方"默认细度"读法）
    value_map:                         # ⚠️ 大区映射是**业务约定**，不是数据库字段 → 必须走 value_map
      "华东": ["310000", "320000", "330000", "340000", "350000", "360000", "370000"]
      "华南": ["440000", "450000", "460000"]
      "华北": ["110000", "120000", "130000", "140000", "150000"]
      "华中": ["410000", "420000", "430000"]
      "西南": ["500000", "510000", "520000", "530000", "540000"]
      "西北": ["610000", "620000", "630000", "640000", "650000"]
      "东北": ["210000", "220000", "230000"]
    note: "禁止让模型猜大区归属；未列入 value_map 的省 → 归'其他'或不支持。"

  - name: category
    binding: order_paid.category_l1
    hierarchy: [category_l1, category_l2, category_l3]
    grain_levels: { category_l1: 1, category_l2: 2, category_l3: 3 }
    grain_level: 3

  - name: channel
    binding: traffic_daily.channel
    hierarchy: [channel]
    grain_levels: { channel: 1 }
    grain_level: 1
    note: "枚举值见 traffic_daily.channel.enum（5 个渠道）"

  - name: time
    bindings:
      day: pay_time
      week: pay_time
      month: pay_time
      quarter: pay_time
      year: pay_time
    hierarchy: [year, quarter, month, week, day]
    grain_levels: { year: 1, quarter: 2, month: 3, week: 4, day: 5 }
    grain_level: 5
    note: >
      ⚠️ GMV 的时间维度**必须绑定 pay_time**，不得用 create_time。
      流量域的时间绑定是 traffic_daily.stat_date（见 metrics.uv.default_binding）。

  - name: shop
    binding: shop.shop_id
    hierarchy: [shop]
    grain_levels: { shop: 1 }
    grain_level: 1
    note: "店铺维度。shop.city 与 order_paid.receiver_city 同粒度、不同语义 → 真竞争。"

  - name: city
    binding: order_paid.receiver_city
    hierarchy: [region, province, city]
    # ⚠️ 从 2 起而非 1 起是**故意的**：grain_level 是**地理族统一刻度**
    #    （country=1 / region=2 / province=3 / city=4），本维度只覆盖后三层。
    #    L2 的候选比较发生在同族内，故必须沿用族刻度而非重排为 1..N。
    grain_levels: { region: 2, province: 3, city: 4 }
    grain_level: 4
    note: >
      ⚠️ 本维度是"城市"概念的**收货侧**绑定。店铺侧绑定是 shop.city。
      二者 grain_level **相同（=4）** → 构成竞争 → 必须走 field_bindings.城市 的 ambiguous 流程。
      （对齐 07 §6.8.1：**同粒度不同语义**才是必须澄清的形态；
       "城市 vs 区县"因粒度不同而**不**触发澄清 —— 上游 PRD §6.2 的举例与 §6.3.1 相反，
       以 §6.3.1 为准，已登记 U-10。）

# ============================================================================
# 4. 字段绑定（**唯一性保障 —— 核心机制**）
# ============================================================================
# `canonical_asset` —— 概念的**规范字段**（07 §4.7.1：L3 的字段层依据）。
# `default_reason` —— 07 §4.7.1 **新增**字段：命中该默认绑定时**强制披露的文案**
#    （载体 = `insight.caveats[]`，见文件头 U-26 链路；≤ 40 字）。
#
# ⚠️ 两条互斥纪律（校验器断言，不是口头约定）：
#   ① `ambiguous: true` ⇒ **不得有 `canonical_asset`、也不得有 `default_reason`**。
#      原设计留"占位非空 canonical_asset" = **留了一个假值** —— 任何漏判 L3 的路径
#      都会把它当真（07 §4.7.1）。② 非 ambiguous ⇒ **两者都不得缺**。
# ⚠️ 原字段 `field_bindings[].default_binding` **已删**：它与 `canonical_asset`
#    **恒等**（同一事实两处）→ 真正缺失的信息是 `default_reason`。
field_bindings:

  - concept: customer_name
    canonical_asset: shop.shop_name
    time_semantics: current
    grain_level: 1
    default_reason: "主数据现值"
    note: "当前店铺名称（主数据现值）"
    alternatives:
      - asset: order_paid.buyer_id
        use_when: transaction_snapshot
        note: "下单当时买家标识（历史快照）。注意：买方身份标识不可作名称展示"

  - concept: 城市
    # ⚠️ **故意保留歧义**：两个绑定都合法、**同 grain_level（=4）** → 必须触发澄清
    ambiguous: true
    grain_level: 4
    candidates:
      - asset: order_paid.receiver_city
        label: 收货城市
        grain_level: 4
      - asset: shop.city
        label: 店铺所在城市
        grain_level: 4
    clarify_prompt: "你说的「城市」是指收货城市还是店铺所在城市？"
    # ⚠️ 刻意不设 canonical_asset、也不设 default_reason —— 见上方区块注释。
    #    留一个"占位非空"的规范字段 = 把歧义变成假值（07 §4.7.1 点名要求去掉）。

  - concept: 商品名称
    canonical_asset: product.sku_name
    time_semantics: current
    grain_level: 3
    default_reason: "商品名以 SKU 标题为准"
    alternatives:
      - asset: product.spu_id
        use_when: spu_level
        note: "SKU 是销售单元，SPU 是产品单元。用户说'款'时倾向 SPU"

  - concept: 渠道
    canonical_asset: traffic_daily.channel
    time_semantics: current
    grain_level: 1
    default_reason: "渠道枚举定义在流量表"
    note: "⚠️ order_paid.channel 同样存在（成交渠道）。订单域问题应绑 order_paid.channel"

  - concept: 类目
    canonical_asset: order_paid.category_l1
    time_semantics: current
    grain_level: 1
    default_reason: "订单上下文下的类目以成交记录为准"

  - concept: 大区
    canonical_asset: region.region_name
    time_semantics: current
    grain_level: 2
    default_reason: "大区是 value_map 派生的业务约定，非原始列"
    note: "⚠️ 该绑定不可直接生成 SQL —— regression 需经 dimensions.region.value_map 展开"

  - concept: 支付时间
    canonical_asset: order_paid.pay_time
    time_semantics: transaction_time
    grain_level: 5
    default_reason: "交易口径的时间基准"
    alternatives:
      - asset: order_paid.create_time
        use_when: order_snapshot
        note: "下单时间。**GMV 不得用它**"

# ============================================================================
# 5. 允许的 Join 路径（图）—— **未列出 = 禁止**
# ============================================================================
# 契约不变量：`on_columns` 只能是**列对**（左右各一，或同名只写一个）。
#   ⚠️ 这条不变量**不允许**靠新增 join 类型来绕过（07 §4.7.1 关于 U-28 的裁定）。
#
# ⚠️ 两条**必须带 `note`** 的危险边（校验器断言，缺 note 即 FAIL）：
#   ① **跨租户边界的边**：`left` 侧 `tenant_scoped: false` 而 `right` 侧 `true`
#      → 租户谓词**必须落在右侧**，否则会出现跨租户的扇出（一条公共维表行匹配到
#      多个租户的行）。这比"看不到别的租户"更隐蔽：它会让聚合值**变大而无人报警**。
#   ② **两侧声明类型不同的边**：`on_columns` 两列的 `type` 不一致（如 `timestamptz`
#      vs `date`）→ **不是裸等值**，必须把归一化表达式写进 note。
#      否则实现者会写出 `ON pay_time = date_key`（永不命中 → **静默 0 行**）。
joins:
  - left: order_paid.sku_id
    right: product.sku_id
    type: many_to_one
    on_columns: [sku_id]
    certified_by: data-team
  - left: order_paid.shop_id
    right: shop.shop_id
    type: many_to_one
    on_columns: [shop_id]
    certified_by: data-team
  - left: order_paid.region_code
    right: region.code
    type: many_to_one
    on_columns: [region_code, code]
    certified_by: data-team
  - left: order_paid.sub_order_id
    right: order_refund.sub_order_id
    type: one_to_zero_or_one
    on_columns: [sub_order_id]
    certified_by: data-team
  - left: traffic_daily.sku_id
    right: product.sku_id
    type: many_to_one
    on_columns: [sku_id]
    certified_by: data-team
  - left: product.shop_id
    right: shop.shop_id
    type: many_to_one
    on_columns: [shop_id]
    certified_by: data-team
  - left: product.category_l1
    right: order_paid.category_l1
    type: reference
    on_columns: [category_l1]
    certified_by: data-team
    note: "类目名称对齐通路（避免 UUID 式类目 id 缺维表）"

  # ---- U-28：区间关联（活动期订单）的**两跳路径**，07 §4.7.1 **要求显式登记** ----
  #   裁定原文：「区间关联不新增 join 类型，**只能经 `v_dim_date` 两跳**；
  #   语义包必须**显式登记**该 2 跳路径，否则 **gate1 R10 一律拒绝**」。
  #   → 下面把两跳**拆成两条边**登记（这就是"显式登记"：不登记则路径不可达、R10 拒绝）。
  #
  #   ⚠️ 实测（2026-09-16，沙箱库）：这条路径**不是**理想的等值两跳，有两个必须写明的陷阱：
  #     ① `order_paid.pay_time` 是 `timestamptz`、`dim_date.date_key` 是 `date`
  #        → **不是裸等值**，必须写 `date(order_paid.pay_time) = v_dim_date.date_key`。
  #     ② `v_dim_date` 是**公共日历**（`tenant_scoped: false`），而它的 `campaign_id` 只有
  #        **4 个 PROM 值**（PROM_618_2025 / PROM_618_2026 / PROM_DOUBLE11_2024 /
  #        PROM_DOUBLE11_2025，共 102 天有值、628 天为 null），**且这 4 个 id 在 3 个租户里
  #        都存在同名活动**（实测：4 个 campaign_id 各自命中 >1 个租户）
  #        → 这一跳**必须带租户谓词**（落在 `campaign` 侧），否则**一条 dim_date 行会匹配
  #        3 条 campaign 行 → 3 倍扇出**，聚合值静默变大。
  #     ③ 这也意味着：**只有大促窗口内的订单**能经此路径关联到活动；日常促销
  #        （`NORMAL-YYYY-MM-T_x`，账号内 24 条）在 `dim_date` 里**没有**映射
  #        → 问"本月活动订单"时，若不加限定会**只统计到大促**。
  #        该事实必须进评测报告的"已知限制"，不得当成完整覆盖。
  - left: order_paid.pay_time
    right: dim_date.date_key
    type: many_to_one
    on_columns: [pay_time, date_key]
    certified_by: data-team
    note: "U-28 两跳第 1 跳。⚠️ **非裸等值**：pay_time 是 timestamptz、date_key 是 date → 实现必须写 date(order_paid.pay_time) = v_dim_date.date_key。"
  - left: traffic_daily.stat_date
    right: dim_date.date_key
    type: many_to_one
    on_columns: [stat_date, date_key]
    certified_by: data-team
    note: "U-28 可用同构路径（流量侧）。两侧同为 date → 裸等值。"
  - left: dim_date.campaign_id
    right: campaign.campaign_id
    type: many_to_one
    on_columns: [campaign_id]
    certified_by: data-team
    note: "U-28 两跳第 2 跳。⚠️ **跨租户边界的边**：左为公共日历（tenant_scoped: false）、右为租户资产 → 租户谓词必须落在 campaign 侧，否则一条 dim_date 行匹配 3 个租户的同名活动 → 3 倍扇出。且 dim_date.campaign_id 仅大促窗口有值（102/730 天）。"

  # ⚠️ 刻意**不列出**：order_paid × traffic_daily 的直连。
  #    二者只能经 product 桥接（2 跳）。直连 = 语义错误的关联（订单与流量无共同粒度键）
  #    → 对应红队用例 RT-JOIN-003「未认证 JOIN 路径」。
  # ⚠️ 未列出的路径一律禁止，防止笛卡尔积与错误关联（附录 B §B.1.3）。

# ============================================================================
# 6. 默认过滤谓词（隐式业务规则）
# ============================================================================
default_predicates:
  orders:
    - id: dp_order_001
      predicate: "is_test_order = false"
      reason: "排除测试单"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu, refund_rate, repurchase_rate_90d]
    - id: dp_order_002
      predicate: "refund_status <> 'refunded'"
      reason: "GMV 口径剔除全额退款"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu]
    - id: dp_order_003
      predicate: "pay_status = 'paid'"
      reason: "仅统计已支付"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu, refund_rate, repurchase_rate_90d]
  traffic:
    - id: dp_traffic_001
      predicate: "uv >= 0"
      reason: "防御性谓词：排除脏数据负数访客（生成器会注入 0 值，但不会注入负数）"
      owner: data-team
      applies_to: [uv, pay_cvr]

