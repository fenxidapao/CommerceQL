# ============================================================================
# CommerceQL 语义包 v2026.09.14.1
# 归属窗口：W1A（docs/08 §4.1：`semantic/**` 归 W1A）
# Owner: data-team（占位）    审批: 待签    生效: 2026-09-15
#
# ⚠️ 任何修改必须走 PR + 审批；版本递增后缓存 / few-shot 索引必须失效
#    （附录 B §B.4.1 版本变更影响表）。
#
# ---- 结构权威来源 ----
#   骨架字段：附录 B v1.1 §B.1.2（meta / assets / metrics / dimensions /
#             field_bindings / joins / default_predicates / time_semantics /
#             policies / quality_gates）
#   检索承载：07 §12.2（asset / metric_def / dimension / field_binding /
#             join_path / synonym / policy / default_predicate 八张物化表）
#   校验步骤：07 §6.1（五步）
#
# ---- 本文件相对附录 B §B.1.2 示例的 **扩展字段** ----
#   ⚠️ 这些字段已由 **07 §4.7.1 裁定**（2026-09-16，v0.8）。原登记号 U-23 已销账。
#   裁定结论 = **采纳 3 / 收窄 1 / 删除 2**，本文件已按裁定落笔：
#     ✅ `dimensions[].grain_levels`    → L2 判「同粒度」的**唯一依据**（07 §6.8.1）
#     ✅ `dimensions[].grain_level`     → 该维度**默认细度**；必须 == grain_levels[hierarchy[-1]]
#     ✅ `assets[].tenant_scoped`       → 07 §7.4 分支 3 判据（校验器双向断言 ⇔ 含 tenant_id 列）
#     ✅ `assets[].quality_score`       → 07 §12.2 `asset.quality_score`
#     ✅ `metrics[].default_binding`    → ⚠️ **已收窄为 `{asset, reason}`**，`time_field` **已删**
#                                          （与附录 B 既有 `time_basis` 重复 → 同一事实两处必然漂移）
#     ❌ `assets[].grain_level`         → **已删**。理由：07 全文仅出现一次、无消费者，且与
#                                          `dimensions[].grain_level` **同名不同义**（同名最易被误用）
#     ❌ `field_bindings[].default_binding` → **已删**（与 `canonical_asset` 恒等 → 同一事实两处）
#                                          → 改为新增 `field_bindings[].default_reason`（真正缺失的信息）
#     ❌ `meta.disclosure_text`         → **已删**（U-26 改判）。披露载体 = **`insight.caveats[]`**
#                                          （附录 A §A.1.2 第 8 条：必须展示、不可折叠），
#                                          本文件只提供**文案字段**，不提供渲染字段。
#
# ---- U-26 的披露链路（裁定后，本文件承担其中两段）----
#   指标层文案 = `metrics[].default_binding.reason`
#   概念层文案 = `field_bindings[].default_reason`
#   渲染规则（确定性，由 API 层执行）：去重 → 按 display_name / concept 字典序 → 每条 ≤ 40 字
#   ⚠️ **禁止**塞进 `scope.notice` —— 那是**权限范围披露**的专用字段（附录 A §A.1.5 的三条
#      泄露红线按它定义）。把"口径默认"混进去会让"跨租户不可见"与"口径默认"无法区分。
#
#   另有 **2 处新增顶层区块**（附录 B 无，但 DoD⑤ 与 §B.3.4 需要承载位）：
#     · `aliases`          —— L1 层唯一入口（附录 B 把同义词散落在 metric.synonyms /
#                             column.synonyms 两处，07 §12.2 却要求一张扁平 `synonym` 表）
#     · `blacklist_terms`  —— 附录 B §B.3.4「无字段 → 拒答」与「需澄清阈值」的词
#   详细形状与理由见 `semantic/SCHEMA_v1.md`（v1.1，已按 §4.7.1 同步）。
# ============================================================================

meta:
  version: "2026.09.14.1"
  domain: ["orders", "products", "traffic"]
  dialect: postgresql
  published_at: "2026-09-15T20:00:00+08:00"
  published_by: "data-team"
  status: "candidate"          # candidate | active | published | deprecated（07 §6.1 版本状态机）
  timezone: "Asia/Shanghai"
  fiscal_year_start_month: 1   # 财年起始月（1 = 自然年）。附录 B v1.1 已确认（PRD §17.1 / FR-1.3）
  week_starts_on: "monday"     # 周起点 = 周一。附录 B v1.1 已确认，决定"本周/上周"的解析边界

  # 向量维度声明 —— 07 §6.1 步骤⑤要求「EMBEDDING_DIM 与 YAML 声明一致」，
  # 但附录 B 结构示例里**没有任何位置声明维度**。→ U-25，**07 §4.7.1 已裁定采纳**。
  # 当前值与 `app/core/config.py` 默认值一致（EMBEDDING_MODEL=bge-m3 / EMBEDDING_DIM=1024），
  # 该一致性由 `validate_bundle.py` 步骤⑤断言。
  embedding:
    model: "bge-m3"
    dim: 1024

  # ⚠️ 此处**刻意没有** `disclosure_text`。
  #   U-26 的裁定是 **不采纳** `meta.disclosure_text`：`resolved_default` 态的披露文案，
  #   指标层走 `metrics[].default_binding.reason`、概念层走 `field_bindings[].default_reason`，
  #   最终载体是 **`insight.caveats[]`**（附录 A §A.1.2 第 8 条，必须展示、不可折叠）。
  #   私增 meta 字段会违反"附录 A 是接口唯一规范源"（07 §4.1）。
  #   → 定义在别处的渲染字段，不得在这里再出现一次。校验器有**负向断言**防它回归。

# ============================================================================
# 1. 认证资产（**只有这些可被检索** —— 未进本包的资产模型不可检索、不可引用、不可生成）
# ============================================================================
#
# ⚠️ `assets[].grain_level`（原 W1A 提议的"资产细度档 1–6"）**已按 07 §4.7.1 删除**。
#    三条理由（架构窗口裁定原文）：
#      ① 07 全文该字段名**仅出现一次**（§12.2 表结构清单），**无任何消费者**；
#      ② 与 `dimensions[].grain_level` **同名不同义** —— 而"两套刻度永不比较"正是 W1A
#         自己立的纪律，**同名是最容易被违反的形态** → 直接删掉资产档；
#      ③ §6.8 步③ 的粒度校验用 `asset.grain`（枚举 token）已足够。
#    将来若真需要跨资产细度比较，**正确做法是给 `grain` 加"域内顺序表"**，
#    不是凭空造一根全局 1–6 刻度（那根刻度已作废，勿复活）。
#
# `assets[].row_estimate` —— 本文件的值 = **沙箱实测行数**（07 §4.7.4 第 1 条裁定：
#    `params.*` 是生成器**名义输入**，`measured.*` 是**实测事实**，两者必须在产物里分开；
#    语义包的 `row_estimate` 填**实测值**）。逐表实测证据见 `eval/MANIFEST_v1.json`
#    的 `measured` 段；名义值与被"空区间"吃掉的部分见同文件 `inputs_nominal` 段。
#
assets:

  - logical_name: order_paid
    physical_asset: v_order_paid          # 认证逻辑视图，非裸表
    grain: sub_order                      # 粒度：子订单
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true                   # ★ RLS 生效 → 07 §7.4 分支 3 判据
    quality_score: 0.98                   # ★ 与 quality_gates 阈值联判 certified
    freshness_sla: "PT6H"                 # ISO 8601 duration，6 小时
    level: hot                            # hot=当日可用 | warm | cold
    row_estimate: 494249                  # 实测（名义 500000 被 T_C 2025-02 空区间吃掉 5751）
    description: "已支付子订单事实表。默认已剔除取消/测试单。GMV 的唯一来源。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据）。**不暴露给模型生成**——由执行层 SET app.tenant_id 注入"
        sensitive: tenant_key
      - name: sub_order_id
        type: text
        comment: "子订单号，主键"
        synonyms: ["子订单号", "订单号"]
      - name: order_id
        type: text
        comment: "父订单号（一个订单可含多个子订单）"
      - name: shop_id
        type: text
        comment: "店铺 ID"
      - name: buyer_id
        type: text
        comment: "买家 ID（脱敏哈希）。ARPU 的分母来源"
      - name: sku_id
        type: text
        comment: "SKU 唯一标识，最小销售单元"
        synonyms: ["SKU", "单品", "货品"]
      - name: spu_id
        type: text
        comment: "SPU 标准产品单元（同款不同规格共用）"
        synonyms: ["SPU", "款"]
      - name: category_l1
        type: text
        comment: "一级类目名"
      - name: category_l2
        type: text
        comment: "二级类目名"
      - name: category_l3
        type: text
        comment: "三级类目名"
      - name: pay_amount
        type: numeric
        comment: "实付金额（含运费，扣除优惠后）"
        unit: CNY
        synonyms: ["实付金额", "支付金额"]
      - name: freight_amount
        type: numeric
        comment: "运费"
        unit: CNY
      - name: discount_amount
        type: numeric
        comment: "优惠金额"
        unit: CNY
      - name: quantity
        type: int
        comment: "购买数量。**件单价的分母，不等于客单价**"
      - name: pay_time
        type: timestamptz
        comment: "支付完成时间。**这是 GMV 的时间基准**"
        time_semantics: transaction_time
      - name: create_time
        type: timestamptz
        comment: "下单时间。**不要用于 GMV 统计**"
        time_semantics: transaction_time
      - name: pay_status
        type: text
        comment: "支付状态"
        enum: { paid: "已支付", unpaid: "未支付" }
      - name: refund_status
        type: text
        comment: "退款状态"
        enum: { none: "无退款", partial: "部分退款", refunded: "全额退款" }
      - name: region_code
        type: text
        comment: "收货省份编码（6 位数字字符串）"
      - name: receiver_city
        type: text
        comment: "收货城市（含'市'后缀）。与 shop.city 同粒度不同语义 → 构成真竞争，须澄清"
      - name: channel
        type: text
        comment: "成交渠道"
        enum: { search: "搜索", feed: "推荐", live: "直播", direct: "直接访问", ad: "付费广告" }
      - name: is_test_order
        type: boolean
        comment: "是否测试单"
      - name: receiver_phone
        type: text
        comment: "收件人手机号"
        sensitive: pii_phone            # ⚠️ 敏感列标记 → 进 policies.deny_columns
      - name: receiver_address
        type: text
        comment: "收件人详细地址"
        sensitive: pii_address

  - logical_name: order_refund
    physical_asset: v_order_refund
    grain: refund_record
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.96
    freshness_sla: "PT12H"
    level: warm
    row_estimate: 23116                   # 实测（名义 25000）
    description: "退款事实表。与 order_paid 一对零或一。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键"
        sensitive: tenant_key
      - name: refund_id
        type: text
        comment: "退款单号，主键"
      - name: sub_order_id
        type: text
        comment: "关联子订单号"
      - name: refund_amount
        type: numeric
        comment: "退款金额"
        unit: CNY
      - name: refund_type
        type: text
        comment: "退款类型"
        enum: { partial: "部分退款", full: "全额退款" }
      - name: refund_time
        type: timestamptz
        comment: "退款完成时间"
        time_semantics: transaction_time
      - name: refund_status
        type: text
        comment: "退款状态"
        enum: { applied: "申请中", approved: "已通过", refunded: "已退款完成", rejected: "已驳回" }

  - logical_name: product
    physical_asset: v_product
    grain: sku
    domain: products
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "PT24H"
    level: warm
    row_estimate: 6000                    # 实测 = 3 租户 × 2,000（名义 2000 是**单租户**）
    description: "SKU 商品维表。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键"
        sensitive: tenant_key
      - name: sku_id
        type: text
        comment: "SKU 唯一标识"
        synonyms: ["SKU", "单品", "规格"]
      - name: sku_name
        type: text
        comment: "商品标题"
        synonyms: ["商品名", "标题", "商品标题"]
      - name: spu_id
        type: text
        comment: "SPU 标识"
      - name: shop_id
        type: text
        comment: "所属店铺"
      - name: category_l1
        type: text
        comment: "一级类目"
      - name: category_l2
        type: text
        comment: "二级类目"
      - name: category_l3
        type: text
        comment: "三级类目"
      - name: list_price
        type: numeric
        comment: "标价（吊牌价，**非成交价**）"
        unit: CNY
      - name: cost_price
        type: numeric
        comment: "成本价。**仅 finance 角色可见**"
        unit: CNY
        sensitive: internal_cost          # ⚠️ 按角色屏蔽 → 进 policies.deny_columns
      - name: on_sale
        type: boolean
        comment: "是否在架"
      - name: launch_date
        type: date
        comment: "上架日期"

  - logical_name: shop
    physical_asset: v_shop
    grain: shop
    domain: products
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.97
    freshness_sla: "PT24H"
    level: warm
    row_estimate: 12                      # 实测（3 租户 × 2–5 店铺，与名义一致）
    description: "店铺维表。含 shop.city —— 与 order_paid.receiver_city 同粒度不同语义，是澄清机制的标准案例。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键"
        sensitive: tenant_key
      - name: shop_id
        type: text
        comment: "店铺 ID，主键"
      - name: shop_name
        type: text
        comment: "店铺名称"
        synonyms: ["店铺名", "店名"]
      - name: city
        type: text
        comment: "**店铺所在城市**（与收货城市同名不同义）"
      - name: category_l1
        type: text
        comment: "主营一级类目"
      - name: open_date
        type: date
        comment: "开店日期"

  - logical_name: region
    physical_asset: v_region
    grain: province
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: false                  # ★ 公共参考维表（非租户数据）→ §7.4 分支 4 的对照样本
    quality_score: 0.99
    freshness_sla: "P7D"
    level: cold
    row_estimate: 31                      # 实测省数（名义 34）
    description: "省级行政区参考维表（公共）。大区（华东/华南…）**不是本表字段**，而是业务约定，见 dimensions.region.value_map。"
    columns:
      - name: code
        type: text
        comment: "省级编码（6 位）"
      - name: province_name
        type: text
        comment: "省名"
        synonyms: ["省份", "省"]
      - name: region_name
        type: text
        comment: "大区名（华东/华南/…）。**由 value_map 派生，非原始列**"

  - logical_name: campaign
    physical_asset: v_campaign
    grain: campaign
    domain: orders
    owner: operations
    certified: true
    tenant_scoped: true
    quality_score: 0.93
    freshness_sla: "PT24H"
    level: warm
    row_estimate: 84                      # 实测 = 3 租户 × 28（名义 24 是**单租户**）
    description: "活动/大促维表。用于把'618''双11'这类业务区间映射为日期区间。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键"
        sensitive: tenant_key
      - name: campaign_id
        type: text
        comment: "活动 ID，主键"
      - name: campaign_name
        type: text
        comment: "活动名称"
        # ⚠️ 刻意**不含**"大促"：附录 B §B.3.3 明确「大促 = 歧义：需澄清是哪个大促」，
        #    故它只能出现在 blacklist_terms（action: clarify），不得作为 campaign 的别名。
        #    否则 L1 会把它确定性解析掉，歧义被静默吞掉 —— 这正是 §6.8.3 要诊断的失效形态。
        synonyms: ["活动名"]
      - name: campaign_type
        type: text
        comment: "活动类型"
        enum: { prom_618: "618", prom_double11: "双11", normal_sale: "日常促销" }
      - name: start_date
        type: date
        comment: "活动开始日（**含预售期**）"
      - name: end_date
        type: date
        comment: "活动结束日（含）"

  - logical_name: traffic_daily
    physical_asset: v_traffic_daily
    grain: sku_day_channel
    domain: traffic
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.94
    freshness_sla: "PT12H"
    level: hot
