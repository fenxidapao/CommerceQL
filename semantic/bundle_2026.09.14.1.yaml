      - name: sku_id
        type: text
        comment: "SKU 标识"
      - name: channel
        type: text
        comment: "流量渠道"
        enum: { search: "搜索", feed: "推荐", live: "直播", direct: "直接访问", ad: "付费广告" }
      - name: uv
        type: bigint
        comment: "独立访客数（按用户去重，自然日窗口）。跨日累加会重复计数"
        synonyms: ["UV", "访客数", "独立访客"]
      - name: pv
        type: bigint
        comment: "页面浏览量（不去重）"
      - name: cart_add_cnt
        type: bigint
        comment: "加购次数"
      - name: order_cnt
        type: bigint
        comment: "支付订单数"
      - name: ad_cost
        type: numeric
        comment: "广告花费（用于 ROI）"
        unit: CNY
      # ⚠️ 转化率不存成列！由 metric 定义，避免口径分裂（附录 B §B.1.3）

  - logical_name: dim_date
    physical_asset: v_dim_date
    grain: day
    grain_level: 4                        # ★ 资产细度档 —— 日期维属明细主数据档
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: false                  # ★ 公共日历维表 → §7.4 分支 4 的第二个对照样本
    quality_score: 0.99
    freshness_sla: "P30D"
    level: cold
    row_estimate: 731                     # 24 个月
    description: "日期维表（公共）。把'上个月''近7天'这类相对时间锚定到绝对区间。"
    columns:
      - name: date_key
        type: date
        comment: "日期，主键"
      - name: year
        type: int
        comment: "年"
      - name: quarter
        type: int
        comment: "季度（1–4）"
      - name: month
        type: int
        comment: "月（1–12）"
      - name: iso_week
        type: int
        comment: "ISO 周序号（**周一为起点**，对齐 meta.week_starts_on）"
      - name: day_of_week
        type: int
        comment: "星期（1=周一 … 7=周日）"
      - name: is_weekend
        type: boolean
        comment: "是否周末"
      - name: campaign_id
        type: text
        comment: "所属活动 ID（无则为 null）"

# ============================================================================
# 2. 指标定义（**唯一权威口径**）
# ============================================================================
# `default_binding`（★ U-23 扩展）：该指标默认绑定的资产与时间字段。
# L3 层的语义是「该概念已有默认口径，且无排他候选 → 直接执行 + 强制披露」。
# 对指标而言，最常缺的默认是「用哪张表、哪个时间字段」—— 用户问"GMV 多少"
# 不会说"用 pay_time 算"，而 pay_time / create_time 都在同一张表里。
metrics:

  - name: gmv
    display_name: GMV
    domain: orders
    expression: "SUM(order_paid.pay_amount)"
    default_aggregation: sum
    unit: CNY
    owner: finance
    status: active
    definition_note: >
      口径：按支付完成时间（pay_time）统计；含运费；剔除全额退款订单；剔除测试单。
      与财务口径的差异仅在"部分退款"处理上 —— 本口径暂不扣减部分退款。
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "GMV 的时间基准固定为 pay_time，而非 create_time"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["GMV", "gmv", "成交额", "销售额", "交易额", "成交金额", "流水"]
    created_at: "2026-09-14"
    version: 1

  - name: order_cnt
    display_name: 订单量
    domain: orders
    expression: "COUNT(DISTINCT order_paid.sub_order_id)"
    default_aggregation: count_distinct
    unit: 单
    owner: operations
    status: active
    definition_note: "按子订单计数（非父订单）；仅已支付、未取消、未全额退款。"
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "订单量同为交易口径，与 GMV 共用时间基准"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["订单量", "单量", "订单数", "成交单量", "出单量"]
    created_at: "2026-09-14"
    version: 1

  - name: aov
    display_name: 客单价
    domain: orders
    expression: "SUM(order_paid.pay_amount) / NULLIF(COUNT(DISTINCT order_paid.sub_order_id), 0)"
    default_aggregation: ratio_of_sums
    unit: CNY
    owner: operations
    status: active
    definition_note: >
      ⚠️ 高危口径。分母 = **支付子订单数**（非买家数、非父订单数）。
      若业务需要"人均消费"，应使用独立指标 arpu，**不要复用 aov**。
      ⚠️ "件单价"（pay_amount / quantity）**不是** aov → 见 blacklist_terms。
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "客单价属交易口径"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["客单价", "平均订单金额", "AOV"]
    created_at: "2026-09-14"
    version: 1

  - name: arpu
    display_name: 人均消费
    domain: orders
    expression: "SUM(order_paid.pay_amount) / NULLIF(COUNT(DISTINCT order_paid.buyer_id), 0)"
    default_aggregation: ratio_of_sums
    unit: CNY
    owner: operations
    status: active
    definition_note: "分母 = 去重买家数。与 aov **不可混用**。"
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "人均消费属交易口径"
    default_predicates:
      - "pay_status = 'paid'"
      - "refund_status <> 'refunded'"
      - "is_test_order = false"
    time_basis: pay_time
    synonyms: ["人均消费", "人均产出", "ARPU"]
    created_at: "2026-09-14"
    version: 1

  - name: refund_rate
    display_name: 退款率
    domain: orders
    expression: >
      SUM(CASE WHEN order_paid.refund_status = 'refunded' THEN order_paid.pay_amount ELSE 0 END)
      / NULLIF(SUM(order_paid.pay_amount), 0)
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: finance
    status: active
    definition_note: "**按金额、按退款完成**。若要按单量口径，须另立 refund_rate_qty（P1）。"
    # ⚠️ 本指标的谓词**不含** `refund_status <> 'refunded'` —— 分子正是靠退款行为算出来的。
    default_predicates:
      - "pay_status = 'paid'"
      - "is_test_order = false"
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "退款率以支付订单为分母，时间随分母"
    time_basis: pay_time
    synonyms: ["退款率", "退货率", "退款占比"]
    created_at: "2026-09-14"
    version: 1

  - name: repurchase_rate_90d
    display_name: 90天复购率
    domain: orders
    expression: >
      COUNT(DISTINCT CASE WHEN cnt >= 2 THEN buyer_id END)
      / NULLIF(COUNT(DISTINCT buyer_id), 0)
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: operations
    status: active
    window: "90 days"
    definition_note: "90 天内购买 ≥ 2 次；**不含首单口径**。周期固定 90 天，不接受运行时改窗口。"
    default_predicates:
      - "pay_status = 'paid'"
      - "is_test_order = false"
    default_binding:
      asset: order_paid
      time_field: pay_time
      reason: "复购窗口以支付时间为基准"
    time_basis: pay_time
    synonyms: ["复购率", "回购率", "复购"]
    created_at: "2026-09-14"
    version: 1

  - name: uv
    display_name: UV
    domain: traffic
    expression: "SUM(traffic_daily.uv)"
    default_aggregation: sum
    unit: 人
    owner: operations
    status: active
    definition_note: >
      按用户去重、**自然日窗口**。跨日直接累加会重复计数 ——
      跨日区间应使用独立口径 uv_period（P1，本包未定义 → 未定义的指标**不得被生成**）。
    default_predicates:
      - "uv >= 0"
    default_binding:
      asset: traffic_daily
      time_field: stat_date
      reason: "流量表的时间基准是 stat_date（date 型），不是 pay_time"
    time_basis: stat_date
    synonyms: ["UV", "uv", "访客数", "独立访客"]
    created_at: "2026-09-14"
    version: 1

  - name: pay_cvr
    display_name: 支付转化率
    domain: traffic
    expression: "SUM(traffic_daily.order_cnt) * 1.0 / NULLIF(SUM(traffic_daily.uv), 0)"
    default_aggregation: ratio_of_sums
    unit: ratio
    owner: operations
    status: active
    definition_note: "**支付**转化（非下单转化），分母为 UV。转化率不落成列，只在此定义。"
    default_predicates:
      - "uv >= 0"
    default_binding:
      asset: traffic_daily
      time_field: stat_date
      reason: "转化率的分母是流量，时间随 UV"
    time_basis: stat_date
    synonyms: ["转化率", "支付转化率", "CVR", "成交转化", "转化"]
    created_at: "2026-09-14"
    version: 1

  - name: sell_through_rate
    display_name: 动销率
    domain: products
    status: draft                      # ⚠️ draft 状态**不可被检索使用**（07 §6.1 版本状态机）
    definition_note: "口径待业务确认（观察周期、分母是否含下架商品）。**确认前不对外开放**。"
    synonyms: ["动销率", "动销"]
    created_at: "2026-09-14"
    version: 0
    # ⚠️ 刻意**不设** expression / default_binding：draft 指标不参与 L3。
    # 若 draft 也带 default_binding，L3 会把它当成"有默认口径"而放行 —— 那正是
    # FR-12.3「禁止 LLM 自动发布语义」要防的事。

# ============================================================================
# 3. 维度与层级
# ============================================================================
# `grain_level`（★ U-23）：数值，**1 = 最粗**。**只在同一 grain 序列内可比**
#   （时间序列 / 地理序列 / 商品序列各自独立刻度，跨序列比较无意义）。
# `grain_levels`：层级名 → 细度值 的映射，供 L2 的"粒度词抽取 → 查表"使用
#   （07 §6.8.1：「抽取失败 → 不进入 L2」）。
dimensions:

  - name: region
    binding: order_paid.region_code
    hierarchy: [country, region, province, city]
    grain_levels: { country: 1, region: 2, province: 3, city: 4 }
    grain_level: 4                     # binding 落在 city 层（v_region.province_name 用于名称回填）
    value_map:                         # ⚠️ 大区映射是**业务约定**，不是数据库字段 → 必须走 value_map
      "华东": ["310000", "320000", "330000", "340000", "350000", "360000", "370000"]
      "华南": ["440000", "450000", "460000"]
      "华北": ["110000", "120000", "130000", "140000", "150000"]
      "华中": ["410000", "420000", "430000"]
      "西南": ["500000", "510000", "520000", "530000", "540000"]
      "西北": ["610000", "620000", "630000", "640000", "650000"]
      "东北": ["210000", "220000", "230000"]
    note: "禁止让模型猜大区归属；未列入 value_map 的省 → 归'其他'或不支持。"

  - name: category
    binding: order_paid.category_l1
    hierarchy: [category_l1, category_l2, category_l3]
    grain_levels: { category_l1: 1, category_l2: 2, category_l3: 3 }
    grain_level: 3

  - name: channel
    binding: traffic_daily.channel
    hierarchy: [channel]
    grain_levels: { channel: 1 }
    grain_level: 1
    note: "枚举值见 traffic_daily.channel.enum（5 个渠道）"

  - name: time
    bindings:
      day: pay_time
      week: pay_time
      month: pay_time
      quarter: pay_time
      year: pay_time
    hierarchy: [year, quarter, month, week, day]
    grain_levels: { year: 1, quarter: 2, month: 3, week: 4, day: 5 }
    grain_level: 5
    note: >
      ⚠️ GMV 的时间维度**必须绑定 pay_time**，不得用 create_time。
      流量域的时间绑定是 traffic_daily.stat_date（见 metrics.uv.default_binding）。

  - name: shop
    binding: shop.shop_id
    hierarchy: [shop]
    grain_levels: { shop: 1 }
    grain_level: 1
    note: "店铺维度。shop.city 与 order_paid.receiver_city 同粒度、不同语义 → 真竞争。"

  - name: city
    binding: order_paid.receiver_city
    hierarchy: [region, province, city]
    # ⚠️ 从 2 起而非 1 起是**故意的**：grain_level 是**地理族统一刻度**
    #    （country=1 / region=2 / province=3 / city=4），本维度只覆盖后三层。
    #    L2 的候选比较发生在同族内，故必须沿用族刻度而非重排为 1..N。
    grain_levels: { region: 2, province: 3, city: 4 }
    grain_level: 4
    note: >
      ⚠️ 本维度是"城市"概念的**收货侧**绑定。店铺侧绑定是 shop.city。
      二者 grain_level **相同（=4）** → 构成竞争 → 必须走 field_bindings.城市 的 ambiguous 流程。
      （对齐 07 §6.8.1：**同粒度不同语义**才是必须澄清的形态；
       "城市 vs 区县"因粒度不同而**不**触发澄清 —— 上游 PRD §6.2 的举例与 §6.3.1 相反，
       以 §6.3.1 为准，已登记 U-10。）

# ============================================================================
# 4. 字段绑定（**唯一性保障 —— 核心机制**）
# ============================================================================
# `default_binding`（★ U-23）：该概念的**默认字段**（L3 层依据）。
# ⚠️ 与 `ambiguous: true` **互斥**：ambiguous 的概念**不得**有 default_binding ——
#    否则 L3 会抢在澄清之前把它"解决"掉，歧义被静默吞掉。
field_bindings:

  - concept: customer_name
    canonical_asset: shop.shop_name
    time_semantics: current
    grain_level: 1
    default_binding:
      asset: shop
      column: shop_name
      reason: "主数据现值"
    note: "当前店铺名称（主数据现值）"
    alternatives:
      - asset: order_paid.buyer_id
        use_when: transaction_snapshot
        note: "下单当时买家标识（历史快照）。注意：买方身份标识不可作名称展示"

  - concept: 城市
    # ⚠️ **故意保留歧义**：两个绑定都合法、**同 grain_level（=4）** → 必须触发澄清
    ambiguous: true
    grain_level: 4
    candidates:
      - asset: order_paid.receiver_city
        label: 收货城市
        grain_level: 4
      - asset: shop.city
        label: 店铺所在城市
        grain_level: 4
    clarify_prompt: "你说的「城市」是指收货城市还是店铺所在城市？"
    # ⚠️ 刻意不设 default_binding —— 见上方区块注释

  - concept: 商品名称
    canonical_asset: product.sku_name
    time_semantics: current
    grain_level: 3
    default_binding:
      asset: product
      column: sku_name
      reason: "商品名以 SKU 标题为准"
    alternatives:
      - asset: product.spu_id
        use_when: spu_level
        note: "SKU 是销售单元，SPU 是产品单元。用户说'款'时倾向 SPU"

  - concept: 渠道
    canonical_asset: traffic_daily.channel
    time_semantics: current
    grain_level: 1
    default_binding:
      asset: traffic_daily
      column: channel
      reason: "渠道枚举定义在流量表"
    note: "⚠️ order_paid.channel 同样存在（成交渠道）。订单域问题应绑 order_paid.channel"

  - concept: 类目
    canonical_asset: order_paid.category_l1
    time_semantics: current
    grain_level: 1
    default_binding:
      asset: order_paid
      column: category_l1
      reason: "订单上下文下的类目以成交记录为准"

  - concept: 大区
    canonical_asset: region.region_name
    time_semantics: current
    grain_level: 2
    default_binding:
      asset: region
      column: region_name
      reason: "大区是 value_map 派生的业务约定，非原始列"
    note: "⚠️ 该绑定不可直接生成 SQL —— regression 需经 dimensions.region.value_map 展开"

  - concept: 支付时间
    canonical_asset: order_paid.pay_time
    time_semantics: transaction_time
    grain_level: 5
    default_binding:
      asset: order_paid
      column: pay_time
      reason: "交易口径的时间基准"
    alternatives:
      - asset: order_paid.create_time
        use_when: order_snapshot
        note: "下单时间。**GMV 不得用它**"

# ============================================================================
# 5. 允许的 Join 路径（图）—— **未列出 = 禁止**
# ============================================================================
joins:
  - left: order_paid.sku_id
    right: product.sku_id
    type: many_to_one
    on_columns: [sku_id]
    certified_by: data-team
  - left: order_paid.shop_id
    right: shop.shop_id
    type: many_to_one
    on_columns: [shop_id]
    certified_by: data-team
  - left: order_paid.region_code
    right: region.code
    type: many_to_one
    on_columns: [region_code, code]
    certified_by: data-team
  - left: order_paid.sub_order_id
    right: order_refund.sub_order_id
    type: one_to_zero_or_one
    on_columns: [sub_order_id]
    certified_by: data-team
  - left: traffic_daily.sku_id
    right: product.sku_id
    type: many_to_one
    on_columns: [sku_id]
    certified_by: data-team
  - left: product.shop_id
    right: shop.shop_id
    type: many_to_one
    on_columns: [shop_id]
    certified_by: data-team
  - left: product.category_l1
    right: order_paid.category_l1
    type: reference
    on_columns: [category_l1]
    certified_by: data-team
    note: "类目名称对齐通路（避免 UUID 式类目 id 缺维表）"
  # ⚠️ 刻意**不列出**：order_paid × traffic_daily 的直连。
  #    二者只能经 product 桥接（2 跳）。直连 = 语义错误的关联（订单与流量无共同粒度键）
  #    → 对应红队用例 RT-JOIN-003「未认证 JOIN 路径」。
  # ⚠️ 未列出的路径一律禁止，防止笛卡尔积与错误关联（附录 B §B.1.3）。

# ============================================================================
# 6. 默认过滤谓词（隐式业务规则）
# ============================================================================
default_predicates:
  orders:
    - id: dp_order_001
      predicate: "is_test_order = false"
      reason: "排除测试单"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu, refund_rate, repurchase_rate_90d]
    - id: dp_order_002
      predicate: "refund_status <> 'refunded'"
      reason: "GMV 口径剔除全额退款"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu]
    - id: dp_order_003
      predicate: "pay_status = 'paid'"
      reason: "仅统计已支付"
      owner: data-team
      applies_to: [gmv, order_cnt, aov, arpu, refund_rate, repurchase_rate_90d]
  traffic:
    - id: dp_traffic_001
      predicate: "uv >= 0"
      reason: "防御性谓词：排除脏数据负数访客（生成器会注入 0 值，但不会注入负数）"
      owner: data-team
      applies_to: [uv, pay_cvr]

# ============================================================================
# 7. 别名表（L1 层唯一入口）
# ============================================================================
# ★ 本区块是 U-23 之外**新增的顶层区块**，理由：
#   · 07 §12.2 的 `synonym` 表是**扁平表**：`(bundle_version, term, lang,
#     maps_to_kind, maps_to_ref)` + `category` + `tsv`；
#   · 附录 B 却把同义词散落在 `metric.synonyms`（附录 B §B.1.2）与
#     `column.synonyms`（同处）两处，**没有**一张能直接物化成 `synonym` 表的扁平清单；
#   · L1 层的判据是「命中该概念且**唯一映射**」→ 唯一性必须**机器可校验**，
#     散落在两处的自然语言列表无法做这个校验。
#   → 本区块即物化前的源；`column.synonyms` / `metric.synonyms` 保留，
#     但**加载器应以本区块为准**，两处不一致视为校验失败（见 SCHEMA_v1.md §5）。
aliases:
  # ---- 指标类（附录 B §B.3.1）----
  - { term: "GMV",       lang: en, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "gmv",       lang: en, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "成交额",     lang: zh, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "销售额",     lang: zh, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "交易额",     lang: zh, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "成交金额",   lang: zh, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "流水",       lang: zh, maps_to_kind: metric, maps_to_ref: gmv, category: metric }
  - { term: "订单量",     lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt, category: metric }
  - { term: "单量",       lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt, category: metric }
  - { term: "订单数",     lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt, category: metric }
  - { term: "成交单量",   lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt, category: metric }
  - { term: "出单量",     lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt, category: metric }
  - { term: "客单价",     lang: zh, maps_to_kind: metric, maps_to_ref: aov, category: metric }
  - { term: "平均订单金额", lang: zh, maps_to_kind: metric, maps_to_ref: aov, category: metric }
  - { term: "AOV",       lang: en, maps_to_kind: metric, maps_to_ref: aov, category: metric }
  - { term: "人均消费",   lang: zh, maps_to_kind: metric, maps_to_ref: arpu, category: metric }
  - { term: "人均产出",   lang: zh, maps_to_kind: metric, maps_to_ref: arpu, category: metric }
  - { term: "ARPU",      lang: en, maps_to_kind: metric, maps_to_ref: arpu, category: metric }
  - { term: "转化率",     lang: zh, maps_to_kind: metric, maps_to_ref: pay_cvr, category: metric }
  - { term: "转化",       lang: zh, maps_to_kind: metric, maps_to_ref: pay_cvr, category: metric }
  - { term: "CVR",       lang: en, maps_to_kind: metric, maps_to_ref: pay_cvr, category: metric }
  - { term: "成交转化",   lang: zh, maps_to_kind: metric, maps_to_ref: pay_cvr, category: metric }
  - { term: "支付转化率",  lang: zh, maps_to_kind: metric, maps_to_ref: pay_cvr, category: metric }
  - { term: "复购",       lang: zh, maps_to_kind: metric, maps_to_ref: repurchase_rate_90d, category: metric }
  - { term: "回购",       lang: zh, maps_to_kind: metric, maps_to_ref: repurchase_rate_90d, category: metric }
  - { term: "复购率",     lang: zh, maps_to_kind: metric, maps_to_ref: repurchase_rate_90d, category: metric }
  - { term: "回购率",     lang: zh, maps_to_kind: metric, maps_to_ref: repurchase_rate_90d, category: metric }
  - { term: "退款率",     lang: zh, maps_to_kind: metric, maps_to_ref: refund_rate, category: metric }
  - { term: "退货率",     lang: zh, maps_to_kind: metric, maps_to_ref: refund_rate, category: metric }
  - { term: "退款占比",   lang: zh, maps_to_kind: metric, maps_to_ref: refund_rate, category: metric }
  - { term: "UV",        lang: en, maps_to_kind: metric, maps_to_ref: uv, category: metric }
  - { term: "uv",        lang: en, maps_to_kind: metric, maps_to_ref: uv, category: metric }
  - { term: "访客数",     lang: zh, maps_to_kind: metric, maps_to_ref: uv, category: metric }
  - { term: "独立访客",   lang: zh, maps_to_kind: metric, maps_to_ref: uv, category: metric }

  # ---- 实体与维度类（附录 B §B.3.2）----
  - { term: "品",        lang: zh, maps_to_kind: asset, maps_to_ref: product, category: entity }
  - { term: "商品",      lang: zh, maps_to_kind: asset, maps_to_ref: product, category: entity }
  - { term: "货",        lang: zh, maps_to_kind: asset, maps_to_ref: product, category: entity }
