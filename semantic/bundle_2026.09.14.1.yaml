# 8. 黑话与不可映射词（**附录 B §B.3.4 的承载位**）
# ============================================================================
# ★ 新增顶层区块，理由：附录 B §B.3.4 的"处理"列明确要求「拒答」或「需澄清阈值」，
#   但 `synonym` 表（07 §12.2）的 `maps_to_kind/maps_to_ref` **无处承载"拒答"语义** ——
#   把所有黑话都塞进 synonym 会造出"term 映射到一个不存在的 ref"的脏数据。
#   → 单独区块，`action` ∈ {refuse, clarify}。
#   ⚠️ 本区块**直接支撑拒答集的构造**（附录 C §C.5.1 的 20–30 条"应拒答"题）。
blacklist_terms:
  - term: "淡季"
    action: refuse
    reason: "无定义的时间概念 —— 无法映射到任何数据资产"
    alt_question: "你可以问「2026 年 3 月的 GMV 是多少」，或指定具体月份区间"
  - term: "旺季"
    action: refuse
    reason: "无定义的时间概念"
    alt_question: "你可以问「618 期间的 GMV 是多少」"
  - term: "坑位费"
    action: refuse
    reason: "live 渠道资源位费用无对应字段（traffic_daily.ad_cost 是广告花费，口径不同）"
    alt_question: "你可以问「各渠道的广告花费是多少」（对应 ad_cost）"
  - term: "坑产"
    action: refuse
    reason: "无对应字段"
    alt_question: "你可以问「直播渠道的 GMV 是多少」"
  - term: "清仓"
    action: refuse
    reason: "无标准字段标记清仓商品"
    alt_question: "你可以问「按标价与实际成交价的折扣率排行」"
  - term: "尾货"
    action: refuse
    reason: "无标准字段"
    alt_question: "同'清仓'"
  - term: "刷单"
    action: refuse
    reason: "无字段；且涉及合规 —— 系统不提供此类分析"
    alt_question: "你可以问「剔除测试单后的 GMV 是多少」"
  - term: "补单"
    action: refuse
    reason: "同'刷单'"
    alt_question: "同'刷单'"
  - term: "兜底价"
    action: refuse
    reason: "最低可售价无对应字段（list_price 是吊牌价，cost_price 是成本价）"
    alt_question: "你可以问「标价与成本价的差额」"
  - term: "爆款"
    action: clarify
    reason: "按销量 Top-N 的俗语，阈值未定"
    clarify_prompt: "你说的「爆款」是指销量 Top 10 吗？还是 Top 50？"
    alt_question: "你可以直接问「销量 Top 10 的商品是哪些」"
  - term: "主推"
    action: clarify
    reason: "同'爆款'"
    clarify_prompt: "你说的「主推」是指销量 Top 10 吗？"
  - term: "头部"
    action: clarify
    reason: "同'爆款'（注意：'头部主播'已在 aliases 中映射到 live 渠道，此处指商品）"
    clarify_prompt: "你说的「头部」是指销量 Top 10 的商品吗？"
  - term: "长尾"
    action: clarify
    reason: "低销量商品集合，阈值未定"
    clarify_prompt: "你说的「长尾」是指销量排名后 50% 的商品吗？"
  - term: "尾部"
    action: clarify
    reason: "同'长尾'"
    clarify_prompt: "同'长尾'"
  - term: "大促"
    action: clarify
    reason: "**歧义：需澄清是哪个大促**（附录 B §B.3.3 逐字给定）"
    clarify_prompt: "你说的「大促」是指 618 还是双11？"
    alt_question: "你可以问「618 期间的 GMV 是多少」"

# ============================================================================
# 9. 时间语义
# ============================================================================
time_semantics:
  transaction_time: "交易发生时的时间戳（pay_time / create_time / refund_time / stat_date）"
  current: "主数据当前值"
  period_end_snapshot: "统计期末快照"
  notes:
    - "'上个月' = 日历上月首日 00:00:00 至末日 23:59:59（Asia/Shanghai）"
    - "'近7天' = 含今天往前 7 个自然日"
    - "'本周' 起点 = **周一**（对齐 meta.week_starts_on）"
    - "'618' = 2026-05-24 至 2026-06-20（**含预售期**）"
    - "'双11' = 2026-10-20 至 2026-11-11（**含预售期**）"
    - "'同比' = 去年同期；'环比' = 上一相邻周期"
  # ⚠️ 大促区间在 v_campaign 表里**也有** start_date/end_date。
  #    两处必然要一致 —— 本包的 notes 是**口径来源**，v_campaign 是**取数来源**；
  #    生成器以本包 notes 为准写入 v_campaign，并由 selfcheck 断言二者一致。

# ============================================================================
# 10. 敏感列与脱敏策略
# ============================================================================
policies:
  - deny_columns:
      - order_paid.receiver_phone
      - order_paid.receiver_address
      - product.cost_price
      - order_paid.tenant_id          # 租户键由执行层注入，模型不得引用
      - order_refund.tenant_id
      - product.tenant_id
      - shop.tenant_id
      - traffic_daily.tenant_id
      - campaign.tenant_id
    applies_to_roles: [support, marketer, finance, analyst, operator, shop_owner]
    note: >
      敏感列**不进 schema 上下文** → 模型不知道存在 → 不会生成查询（附录 B §B.1.3）。
      命中则 AST-R07 直接拒绝（07 §7.2）。
      ⚠️ `tenant_id` 也在此列：它必须由执行层 `SET app.tenant_id` 注入，
      **不得由模型生成**——否则模型可写出跨租户谓词。
  - mask_rules:
      - column_pattern: ".*phone.*"
        rule: "***-***-1234"
      - column_pattern: ".*email.*"
        rule: "u****@domain.com"
      - column_pattern: ".*id_card.*"
        rule: "***-**-6789"
    note: >
      ⚠️ `deny`（拒绝）与 `mask`（掩码）是**两套语义**（07 §8.7）：
      deny 的列**不出现在结果**里；mask 的列**出现但值打码**。
      当前 mask_rules 命中的列全部同时也在 deny_columns 里 —— 这是**有意的冗余**：
      若未来放开某列的 deny，mask 仍然生效。

# ============================================================================
# 11. 质量与准入门槛（07 §6.1 步骤④）
# ============================================================================
quality_gates:
  min_certified: true
  min_quality_score: 0.90            # ★ U-23：与 asset.quality_score 联判
  max_staleness_hours: 24
  require_owner: true
  on_violation: exclude_from_context  # 不报错，降级排除 + 告警（07 §6.1 步骤④）
