# ============================================================================
# CommerceQL 语义包 —— Olist 真实数据轨（薄 v1）
# 版本真相 = 下方 meta.version；文件名 `bundle_olist_2018.yaml` 与版本号**刻意解耦**
#（与默认包 `bundle_2026.09.14.1.yaml` 同一条纪律，见 semantic/README.md）。
#
# 归属窗口：W1 实施窗（docs/07 §4.8 的 U-143）。
# ⚠️ 本包只服务 **SQLite 评测链路**（`meta.dialect: sqlite`）。
#    W3 的 PG demo 不得默认沿用本包的 dialect 声明 —— 见 eval/olist/README.md 已知偏差第 6 条。
#
# ⚠️ `default_predicates` **刻意留空**，不是漏写：
#    域级谓词会被闸门一 R06 注入该域**每一条**查询（实测见
#    `bundle_2026.09.14.1.yaml:1260` 记的 W8 第 41 轮：普通查询 applied_predicates 3→5 条）。
#    一旦把「排除取消单」写进域级谓词，`g07 各订单状态订单数` 就永远算不对，且不报错。
#    ⇒ 所有过滤条件写在 `metrics[].expression` 里；域级块保持空。
#
# 数据源：Olist Brazilian E-Commerce Public Dataset（9 表 / 99,441 orders）。
# 沙箱：data/olist/olist_sandbox.db（deploy/demo/build_olist_sandbox.py 生成）
# ============================================================================

meta:
  version: "2026.10.31.1"
  domain: [orders]
  dialect: "sqlite"
  published_at: "2026-10-27T00:00:00+08:00"
  published_by: "w1-impl"
  status: "candidate"
  timezone: "Asia/Shanghai"
  fiscal_year_start_month: 1
  week_starts_on: "monday"
  embedding:
    model: "bge-m3"
    dim: 1024

# ============================================================================
# 1. 认证资产（只有这些可被检索；物理对象名 = 沙箱表名，一一对应）
# ============================================================================

assets:

  - logical_name: order
    physical_asset: v_o_orders
    grain: order
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "P1D"
    level: warm
    row_estimate: 99441
    description: "订单事实表（父订单粒度）。带收货州/市。GMV 与订单量的时间基准来源。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据）。**不暴露给模型生成** —— 由执行层按租户建 TEMP VIEW 注入"
        sensitive: tenant_key
      - name: order_id
        type: text
        comment: "订单号（父订单）。order_items / payments / reviews 的关联键"
      - name: customer_id
        type: text
        comment: "订单级买家键（一单一值，不代表自然人）"
      - name: customer_unique_id
        type: text
        comment: "自然人级买家键（同一人多次下单同值）"
      - name: customer_state
        type: text
        comment: "收货州（巴西 27 个联邦单位两位码）"
      - name: customer_city
        type: text
        comment: "收货城市"
      - name: order_status
        type: text
        comment: "订单状态。枚举见列内注释：delivered/shipped/canceled/unavailable/invoiced/processing/created/approved"
      - name: order_purchase_timestamp
        type: text
        comment: "下单时间（ISO 8601 字符串）。**本包唯一的交易时间基准**"
      - name: order_approved_at
        type: text
        comment: "支付批准时间。⚠️ 有 160 条空值 ⇒ 不作时间基准"
      - name: order_delivered_customer_date
        type: text
        comment: "实际送达时间。delivered 单里仍有 8 条空值"
      - name: order_estimated_delivery_date
        type: text
        comment: "承诺送达时间"

  - logical_name: order_item
    physical_asset: v_o_order_items
    grain: order_item
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "P1D"
    level: warm
    row_estimate: 112650
    description: "订单明细行（子订单/明细粒度）。商品金额与运费的唯一来源。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据），由执行层注入"
        sensitive: tenant_key
      - name: order_id
        type: text
        comment: "订单号（父订单）"
      - name: order_item_id
        type: integer
        comment: "同一订单内的明细序号，从 1 开始"
      - name: product_id
        type: text
        comment: "商品 ID"
      - name: seller_id
        type: text
        comment: "卖家 ID"
      - name: shipping_limit_date
        type: text
        comment: "卖家承诺发货截止时间"
      - name: price
        type: numeric
        comment: "商品金额（**不含运费**）"
        unit: CNY
      - name: freight_value
        type: numeric
        comment: "运费金额"
        unit: CNY

  - logical_name: product
    physical_asset: v_o_products
    grain: product
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "P7D"
    level: cold
    row_estimate: 32951
    description: "商品维表。品类英文名由平台提供的葡英对照表翻译。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据），由执行层注入"
        sensitive: tenant_key
      - name: product_id
        type: text
        comment: "商品 ID"
      - name: product_category_name
        type: text
        comment: "品类葡语原名（部分商品为空）"
      - name: product_category
        type: text
        comment: "品类英文名（经 product_category_name_translation 翻译；无译名者保留空值）"
      - name: product_weight_g
        type: numeric
        comment: "商品重量（克）"
        unit: g
      - name: product_photos_qty
        type: numeric
        comment: "商品图片数"

  - logical_name: payment
    physical_asset: v_o_payments
    grain: payment
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "P1D"
    level: warm
    row_estimate: 103886
    description: "支付流水（支付方式/分期/金额）。**GMV 的唯一金额来源**；一单可多行。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据），由执行层注入"
        sensitive: tenant_key
      - name: order_id
        type: text
        comment: "订单号（父订单）"
      - name: payment_sequential
        type: integer
        comment: "同一订单内的支付序号（一单可有多行，2,961 单如此）"
      - name: payment_type
        type: text
        comment: "支付方式"
      - name: payment_installments
        type: integer
        comment: "分期数"
      - name: payment_value
        type: numeric
        comment: "本行支付金额（**含运费**）"
        unit: CNY

  - logical_name: review
    physical_asset: v_o_reviews
    grain: review
    domain: orders
    owner: data-team
    certified: true
    tenant_scoped: true
    quality_score: 0.95
    freshness_sla: "P1D"
    level: warm
    row_estimate: 99224
    description: "订单评价。只保留评分与时间，**评论正文未入沙箱**（自由文本，无 PII 审阅结论前不引）。"
    columns:
      - name: tenant_id
        type: text
        comment: "租户隔离键（RLS 依据），由执行层注入"
        sensitive: tenant_key
      - name: review_id
        type: text
        comment: "评价 ID"
      - name: order_id
        type: text
        comment: "订单号（父订单）"
      - name: review_score
        type: integer
        comment: "评分 1–5"
      - name: review_creation_date
        type: text
        comment: "评价创建时间。本指标的时间基准"
      - name: review_answer_timestamp
        type: text
        comment: "评价回复时间"

# ============================================================================
# 2. 指标（9 个；非 draft 必须有 expression / unit / time_basis / default_binding）
#    ⚠️ `order_cnt` / `order_cnt_all` / `aov` 三者边界见各自 definition_note —— 不许合并。
# ============================================================================

metrics:

  - name: gmv
    display_name: GMV
    domain: orders
    status: active
    expression: "SUM(payment.payment_value) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: sum
    unit: CNY
    owner: finance
    default_binding:
      asset: order
      reason: "时间基准固定为下单时间，金额取自支付流水"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：按 order_purchase_timestamp 统计；金额 = SUM(order_payments.payment_value)，
      **含运费**；剔除 order_status ∈ {canceled, unavailable}。
      ⚠️ Olist 无支付时间戳、无退款金额字段 ⇒ 不扣退款、不做退款率。
      交叉验证：有效单下 SUM(payment_value)=15,739,137.01 与 SUM(price+freight)=15,735,527.03
      相差 3,609.98（0.023%）。
    created_at: "2026-10-27"
    version: 1

  - name: order_cnt
    display_name: 订单量
    domain: orders
    status: active
    expression: "COUNT(DISTINCT order.order_id) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: count_distinct
    unit: 单
    owner: operations
    default_binding:
      asset: order
      reason: "已支付口径的订单量，与 GMV 同口径"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：排除 canceled/unavailable 的订单数（有效单 = 98,207）。
      ⚠️ 本指标**数不出各状态**（它把两种状态排除了）—— 问「各状态订单数」必须用 `order_cnt_all`。
    created_at: "2026-10-27"
    version: 1

  - name: order_cnt_all
    display_name: 订单量（全状态）
    domain: orders
    status: active
    expression: "COUNT(DISTINCT order.order_id)"
    default_aggregation: count_distinct
    unit: 单
    owner: operations
    default_binding:
      asset: order
      reason: "全状态口径，专供状态分布类问题"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：**不排除任何 order_status**，全量 99,441 单。
      存在的理由：域级 default_predicates 被本包刻意留空（避免闸门注入污染），
      「全状态」没有第二种承载位；与 `order_cnt` 不是同一指标，不许合并。
    created_at: "2026-10-27"
    version: 1

  - name: aov
    display_name: 客单价
    domain: orders
    status: active
    expression: "SUM(payment.payment_value) / NULLIF(COUNT(DISTINCT order.order_id), 0) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: ratio_of_sums
    unit: CNY
    owner: operations
    default_binding:
      asset: order
      reason: "分子分母同过滤，避免与订单量口径漂移"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：GMV ÷ 有效单量。**两端表达式写全、不引用指标名** —— 否则 `gmv` 或 `order_cnt`
      改过滤时这里会静默漂移。分母用 NULLIF 防除零。
    created_at: "2026-10-27"
    version: 1

  - name: item_gmv
    display_name: 商品销售额（不含运费）
    domain: orders
    status: active
    expression: "SUM(order_item.price) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: sum
    unit: CNY
    owner: finance
    default_binding:
      asset: order_item
      reason: "商品金额取明细行 price，不含运费"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：只算商品金额（order_items.price），**不含运费**。与 `gmv` 的差额 = 运费 ± 支付表差异，
      因此两指标不可互相替代。必须经 order.order_id 关联到有效单。
    created_at: "2026-10-27"
    version: 1

  - name: freight_total
    display_name: 运费总额
    domain: orders
    status: active
    expression: "SUM(order_item.freight_value) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: sum
    unit: CNY
    owner: logistics
    default_binding:
      asset: order_item
      reason: "运费只在明细行上有值"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：有效单的明细行运费合计。运费随订单而非商品计，按商品维度拆分会重复。
    created_at: "2026-10-27"
    version: 1

  - name: item_cnt
    display_name: 商品件数
    domain: orders
    status: active
    expression: "COUNT(*) WHERE order.order_status NOT IN ('canceled','unavailable')"
    default_aggregation: count
    unit: 件
    owner: operations
    default_binding:
      asset: order_item
      reason: "件数以明细行为单位"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：有效单的明细行数（= 售出件数）。粒度是 order_item，不是 order ⇒ 与订单量聚合时必然放大。
    created_at: "2026-10-27"
    version: 1

  - name: avg_review_score
    display_name: 平均评分
    domain: orders
    status: active
    expression: "AVG(review.review_score)"
    default_aggregation: avg
    unit: 分
    owner: operations
    default_binding:
      asset: review
      reason: "评分只在评价表上，按评价创建时间归属"
    time_basis: review_creation_date
    definition_note: >
      口径：评价表 review_score 的算术平均（1–5 分）。分母 = 有评价的订单；
      无评价订单不进分母，**不是**"所有订单的平均"。
    created_at: "2026-10-27"
    version: 1

  - name: delivery_late_rate
    display_name: 配送延迟率
    domain: orders
    status: active
    expression: "100.0 * SUM(CASE WHEN order.order_delivered_customer_date > order.order_estimated_delivery_date THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0) WHERE order.order_status = 'delivered' AND order.order_delivered_customer_date IS NOT NULL AND order.order_estimated_delivery_date IS NOT NULL"
    default_aggregation: ratio_of_sums
    unit: "%"
    owner: logistics
    default_binding:
      asset: order
      reason: "按订单归属，分子分母同一批 delivered 单"
    time_basis: order_purchase_timestamp
    definition_note: >
      口径：已送达且两列均非空的订单里，实际送达晚于承诺送达的占比。
      实测 = 7,826 / 96,470 = 8.112%。
      ⚠️ 三个分母不许混：delivered 共 96,478 单（其中 8 单缺送达日期）；
      "delivered_customer_date 非空"却不加状态过滤 = 96,476 / 7,827（另一个总体）。
    created_at: "2026-10-27"
    version: 1

# ============================================================================
# 3. 维度（4）
# ============================================================================

dimensions:

  - name: date
    bindings:
      day: order_purchase_timestamp
      week: order_purchase_timestamp
      month: order_purchase_timestamp
      quarter: order_purchase_timestamp
      year: order_purchase_timestamp
    hierarchy: [year, quarter, month, week, day]
    grain_levels: { year: 1, quarter: 2, month: 3, week: 4, day: 5 }
    grain_level: 5
    note: >
      时间维度统一绑定下单时间。评价类指标的时间基准是 review_creation_date（见该指标
      default_binding），不与本维度混用。

  - name: customer_state
    binding: order.customer_state
    hierarchy: [customer_state]
    grain_levels: { customer_state: 1 }
    grain_level: 1
    note: "收货州，巴西 27 个联邦单位两位码"

  - name: product_category
    binding: product.product_category
    hierarchy: [product_category]
    grain_levels: { product_category: 1 }
    grain_level: 1
    note: "品类英文名。订单侧须经 order_item.product_id → product.product_id 关联"

  - name: order_status
    binding: order.order_status
    hierarchy: [order_status]
    grain_levels: { order_status: 1 }
    grain_level: 1
    note: "8 个取值。与 order_cnt_all 配合才能得到完整状态分布"

# ============================================================================
# 4. 字段绑定（L3 的数据源；非歧义条目必须有 canonical_asset + default_reason）
# ============================================================================

field_bindings:

  - concept: 州
    canonical_asset: order.customer_state
    time_semantics: current
    grain_level: 1
    default_reason: "订单只有收货州，无店铺州"
    note: "巴西联邦单位两位码"

  - concept: 品类
    canonical_asset: product.product_category
    time_semantics: current
    grain_level: 1
    default_reason: "品类以商品维表现值（英文名）为准"
    note: "部分商品无品类译名，会落在空值组"

  - concept: 订单状态
    canonical_asset: order.order_status
    time_semantics: current
    grain_level: 1
    default_reason: "状态是订单当前值"
    note: "8 个取值；状态分布类问题必须用 order_cnt_all"

  - concept: 下单时间
    canonical_asset: order.order_purchase_timestamp
    time_semantics: transaction_time
    grain_level: 5
    default_reason: "Olist 无支付时间戳，以下单时间为交易时间"
    note: "order_approved_at 有 160 条空值，不作基准"

# ============================================================================
# 5. 允许的 Join 路径（未列出 = 禁止）
# ============================================================================

joins:

  - left: order.order_id
    right: order_item.order_id
    type: one_to_many
    on_columns: [order_id]
    certified_by: data-team

  - left: order.order_id
    right: payment.order_id
    type: one_to_many
    on_columns: [order_id]
    certified_by: data-team

  - left: order.order_id
    right: review.order_id
    type: one_to_many
    on_columns: [order_id]
    certified_by: data-team

  - left: order_item.product_id
    right: product.product_id
    type: many_to_one
    on_columns: [product_id]
    certified_by: data-team

# ============================================================================
# 6. 域级默认谓词 —— **刻意留空**，理由见文件头
# ============================================================================

default_predicates: {}

# ============================================================================
# 7. 别名表（L1 唯一入口；term 必须一对一）
# ============================================================================

aliases:

  - { term: "GMV",         lang: en, maps_to_kind: metric, maps_to_ref: gmv,                category: metric }
  - { term: "gmv",         lang: en, maps_to_kind: metric, maps_to_ref: gmv,                category: metric }
  - { term: "成交额",       lang: zh, maps_to_kind: metric, maps_to_ref: gmv,                category: metric }
  - { term: "销售额",       lang: zh, maps_to_kind: metric, maps_to_ref: gmv,                category: metric }
  - { term: "交易额",       lang: zh, maps_to_kind: metric, maps_to_ref: gmv,                category: metric }
  - { term: "订单量",       lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt,          category: metric }
  - { term: "订单数",       lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt,          category: metric }
  - { term: "成交单量",     lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt,          category: metric }
  - { term: "全状态订单数",  lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt_all,      category: metric }
  - { term: "订单总数",     lang: zh, maps_to_kind: metric, maps_to_ref: order_cnt_all,      category: metric }
  - { term: "客单价",       lang: zh, maps_to_kind: metric, maps_to_ref: aov,                category: metric }
  - { term: "AOV",         lang: en, maps_to_kind: metric, maps_to_ref: aov,                category: metric }
  - { term: "商品销售额",    lang: zh, maps_to_kind: metric, maps_to_ref: item_gmv,           category: metric }
  - { term: "商品金额",     lang: zh, maps_to_kind: metric, maps_to_ref: item_gmv,           category: metric }
  - { term: "运费",         lang: zh, maps_to_kind: metric, maps_to_ref: freight_total,      category: metric }
  - { term: "运费总额",     lang: zh, maps_to_kind: metric, maps_to_ref: freight_total,      category: metric }
  - { term: "商品件数",     lang: zh, maps_to_kind: metric, maps_to_ref: item_cnt,           category: metric }
  - { term: "件数",         lang: zh, maps_to_kind: metric, maps_to_ref: item_cnt,           category: metric }
  - { term: "平均评分",     lang: zh, maps_to_kind: metric, maps_to_ref: avg_review_score,   category: metric }
  - { term: "评分",         lang: zh, maps_to_kind: metric, maps_to_ref: avg_review_score,   category: metric }
  - { term: "配送延迟率",    lang: zh, maps_to_kind: metric, maps_to_ref: delivery_late_rate, category: metric }
  - { term: "延迟率",       lang: zh, maps_to_kind: metric, maps_to_ref: delivery_late_rate, category: metric }

  - { term: "州",           lang: zh, maps_to_kind: dimension, maps_to_ref: customer_state,   category: dimension }
  - { term: "省份",         lang: zh, maps_to_kind: dimension, maps_to_ref: customer_state,   category: dimension }
  - { term: "品类",         lang: zh, maps_to_kind: dimension, maps_to_ref: product_category, category: dimension }
  - { term: "类目",         lang: zh, maps_to_kind: dimension, maps_to_ref: product_category, category: dimension }
  - { term: "订单状态",     lang: zh, maps_to_kind: dimension, maps_to_ref: order_status,     category: dimension }
  - { term: "月份",         lang: zh, maps_to_kind: dimension, maps_to_ref: date,             category: dimension }

  - { term: "下单时间",     lang: zh, maps_to_kind: column, maps_to_ref: order.order_purchase_timestamp, category: time }
  - { term: "订单号",       lang: zh, maps_to_kind: column, maps_to_ref: order.order_id,                  category: column }
  - { term: "商品ID",       lang: zh, maps_to_kind: column, maps_to_ref: product.product_id,              category: column }

# ============================================================================
# 8. 拒答 / 澄清词表
#    ⚠️ refuse 的语义是「refuse 态 + 审计」，不是 error（SCHEMA §6.5）
# ============================================================================

blacklist_terms:

  - term: "退款率"
    action: refuse
    reason: "Olist 无退款金额字段，无法计算退款率；不得用订单状态近似替代"
    alt_question: "要不要改看各订单状态的订单数（含 canceled / unavailable）？"
  - term: "退款金额"
    action: refuse
    reason: "Olist 无退款金额字段"
    alt_question: "要不要改看有效单的 GMV？"
  - term: "利润"
    action: refuse
    reason: "Olist 无成本字段，无法计算利润"
    alt_question: "要不要改看 GMV 或商品销售额？"
  - term: "毛利率"
    action: refuse
    reason: "Olist 无成本字段"
    alt_question: "要不要改看商品销售额与运费的构成？"
  - term: "复购率"
    action: refuse
    reason: "本薄语义包未提供复购类指标（customer_unique_id 虽有，但未建模为指标）"
    alt_question: "要不要改看平均评分或订单量？"
  - term: "库存"
    action: refuse
    reason: "Olist 无库存字段"
    alt_question: "要不要改看商品件数或品类销售额？"

# ============================================================================
# 9. 时间语义（N-26：时间口径只能来自语义包，禁止代码硬编码）
# ============================================================================

time_semantics:
  transaction_time: "交易时间 = order.order_purchase_timestamp（Olist 无支付时间戳）"
  current: "主数据当前值（商品品类以 v_o_products 现值）"
  period_end_snapshot: "统计期末快照"
  notes:
    - "'2018 年' = 2018-01-01 00:00:00 至 2018-12-31 23:59:59（时间列为 ISO 8601 字符串，按字典序比较等价于按时间比较）"
    - "数据覆盖范围 = 2016-09-04 ~ 2018-10-17"
    - "order_approved_at 有 160 条空值 ⇒ 不作任何指标的时间基准"
    - "评价类指标的时间基准是 review_creation_date，与订单侧无关"

# ============================================================================
# 10. 敏感列与脱敏策略
#    ⚠️ deny_columns 是扁平 `<logical_name>.<col>` 列表，用**逻辑资产名**，不是物理表名
# ============================================================================

policies:

  - deny_columns:
      - order.tenant_id
      - order_item.tenant_id
      - product.tenant_id
      - payment.tenant_id
      - review.tenant_id
    applies_to_roles: [analyst, operator, finance, marketer, logistics]
    note: >
      租户键必须由执行层按租户建 TEMP VIEW 注入，**不得由模型生成** ——
      否则模型可写出跨租户谓词（07 §7.2 AST-R07）。
      评论正文（review_comment_title/message）未进沙箱，故无需 deny。

# ============================================================================
# 11. 质量与准入门槛（07 §6.1 步骤④）
# ============================================================================

quality_gates:
  min_certified: true
  min_quality_score: 0.90
  max_staleness_hours: 24
  require_owner: true
  on_violation: exclude_from_context
