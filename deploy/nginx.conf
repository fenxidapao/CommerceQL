# ============================================================================
# Nginx 反代 —— 生产同源（07 §18.1：`web` = Nginx + 静态产物，生产 CORS 关闭）
# 归属窗口：W0 建骨架 → W7 接管（docs/08 §4.1）
#
# ⚠️ 本文件里**唯一真正关键**的是 SSE 三件套：
#    `proxy_buffering off` + `proxy_cache off` + 超长 `proxy_read_timeout`。
#    它们不是性能调优，是**功能开关**：Nginx 默认会缓冲响应，
#    于是 SSE 变成"最后一次性全部吐出"——进度条不动、`stage` 事件全挤在一起，
#    而本机直连 uvicorn 时**完全不复现**。这是最典型的"上了 nginx 才坏"。
# ============================================================================

upstream commerceql_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 前端静态产物（W5 提供；阶段 0 该目录可能为空，不影响 nginx 启动）
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积与超时（SSE 流最长 5 分钟，见附录 A §A.13）
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ⚠️ `Authorization` 必须透传，但**绝不能**出现在 access_log 里（07 §13.1 第 3 条）
    proxy_set_header Authorization     $http_authorization;

    # ---------------- API ----------------
    location /api/ {
        proxy_pass http://commerceql_api;

        # ★ SSE 三件套 —— 缺任一项，流式效果都会消失
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;    # 覆盖 SSE 最长 5 分钟
        proxy_send_timeout 300s;

        # SSE 必须禁用 gzip：压缩会把小帧攒成大块，等于变相缓冲
        gzip off;
    }

    # ---------------- SSE 专用端点（心跳间隔 15s，超时要留足余量）----------------
    location ~ ^/api/v1/(query|clarify) {
        proxy_pass http://commerceql_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
        chunked_transfer_encoding on;
        # 关掉 Nagle，避免小帧被延迟合并（进度条会一顿一顿的）
        tcp_nodelay on;
    }

    # ---------------- 指标导出：**不对公网开放**（W7）----------------
    # 上面的 `location /api/` 是**前缀**匹配，会把 `/api/v1/metrics` 一起代理出去。
    # 附录 A 里没有这个端点的对外契约 ⇒ 它只服务内网 Prometheus，抓取走容器网络直连
    # `api:8000`（compose 的 `observability` profile 里已这么配），不需要一条反代规则。
    # ⚠️ 用 404 而不是 403：403 等于告诉外部"这里有个东西，只是你不许看"。
    #    指标里虽无行级数据，但有**租户维度的成本与错误分布**（N-11 同源的关注）。
    location = /api/v1/metrics {
        access_log off;
        return 404;
    }

    # ---------------- 健康检查直通（不经鉴权，供探针使用）----------------
    location /api/v1/healthz {
        proxy_pass http://commerceql_api;
        access_log off;   # 探针高频访问，不污染访问日志
    }

    # ---------------- 前端 SPA 回退 ----------------
    # ⚠️ 必须回退到 index.html，否则刷新非根路径（如 /eval/runs/xxx）会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ 安全：拒绝把点文件与备份文件暴露出去
    location ~ /\.(?!well-known) {
        deny all;
    }
}
