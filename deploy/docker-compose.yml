# ============================================================================
# 阶段 0 骨架 —— 只保证"起得来 + 探针语义正确"，不含任何业务依赖
# 归属窗口：W0 建骨架 → W7 接管（docs/08 §4.1：`deploy/**` 归 W7）
# 依据：07 §18.1 进程模型 / §18.2 健康检查与启动顺序 / §18.3 优雅停机
#
# ⚠️ 阶段 0 的期望现象（**这不是缺陷**）：
#   `docker compose up` 后 api 容器会显示 unhealthy —— 因为 `/healthz/ready` 只查硬依赖，
#   而元数据库探针 / checkpointer / 语义包 **尚未接线**（分别归 W1B、W2A）。
#   这正是 docs/08 §3.1 DoD① 要求的行为：`/healthz/live` = 200、`/healthz/ready` = 503。
#   因此 web 的 depends_on 用的是 `service_started` 而不是 `service_healthy`，
#   否则阶段 0 整个栈都起不来，DoD① 反而无法验证。
#
# ⚠️ Ollama 不在本文件内：它跑在**宿主**（ADR-05）。容器访问宿主需要 host.docker.internal
#   + 宿主侧绑定，且该绑定**仅对本机/内网开放**（07 §3.4 E-2）。
#   ⚠️ 本机 `wsl.exe` 被安全策略拦截 → 不要写"进 WSL 执行命令"的步骤，
#      一律用 `docker compose exec` / `run`（走 Docker Desktop API）。
#
# ============================================================================
# W7 接管后的两件事（2026-09-18）
#
# ① 优雅停机的触发链（07 §18.3）已经闭合，**别再手动 `docker kill`**：
#      docker stop → PID 1 是 `entrypoint.sh`（不是 uvicorn）→ trap TERM
#      → `drain_client.py begin-wait 32`（POST /healthz/drain 摘 readiness，
#        再轮询 inflight 到 0）→ TERM uvicorn（`--timeout-graceful-shutdown 5`）
#      → lifespan 里的第二道保险（drain 30s，正常路径下是 no-op）
#    三个预算必须自洽：32 + 5 = 37 < `stop_grace_period: 40s` < SIGKILL。
#    · 2026-09-18 用一次性容器 + 假 drain 端点实测过三条路径：有 token ⇒ 置位**之后**在途流
#      才逐条收尾、归零后才转发 TERM；无 token ⇒ 403 但仍转发 TERM、不卡死；
#      预算耗尽 ⇒ `排空=no` 后照样退出（6s ≪ 40s）。未覆盖真实 app + 真实 SSE 客户端。
#    · ⚠️ 优雅停机后 `docker ps -a` 会显示 **`Exited (143)`，这是正常产物**：dash 在 trap
#      跑过之后会反复把 `wait` 报成 128+signo，PID 1 取不到服务进程的真实退出码
#      （脚本按"不伪造"原样报，见 `entrypoint.sh` 尾注）。**只有 137 = 被 SIGKILL**，
#      才是 §18.3 要避免的"流被硬断"。
#    ⚠️ 为什么不能 `exec uvicorn` 直接当 PID 1：实测 uvicorn 0.53 收到 TERM 的顺序是
#      「停监听 → **无限等**在途连接 → 才发 lifespan shutdown」。SSE 是长连接，
#      于是"等客户端自己结束"就是 40s 后的 SIGKILL（静默断连）。必须先于 TERM 摘流量。
#
# ② 两个**只属于部署面**的环境变量：`DRAIN_TOKEN`、`MIGRATION_DATABASE_URL`。
#    它们刻意**不进 `deploy/.env.example`** —— `tests/contract/test_config_failfast.py`
#    要求 `.env.example` 的键集与 `Settings.model_fields` **完全相等**（双向同步），
#    而这两项都不是应用配置项（`DRAIN_TOKEN` 由 `app/api/routers/health.py` 直接读
#    `os.environ`，`MIGRATION_DATABASE_URL` 由 `alembic` 读）。塞进去会让契约测试红。
#    · `DRAIN_TOKEN` 写在**本机** `deploy/.env`（已 gitignore，compose 从这里插值）。
#    · `MIGRATION_DATABASE_URL` **连 `deploy/.env` 也不写**：
#      `tests/unit/test_migration_dsn_hygiene.py` 扫的是整个工作区（含被 ignore 的文件），
#      属主级字面 DSN 一落进仓库树 DoD④ 就红 ⇒ 只在跑迁移的那个 shell 里 `export`。
#    `DRAIN_TOKEN` 缺失时应用会在启动时打 `drain_trigger_unavailable` WARN（不静默）。
# ============================================================================

name: commerceql

services:
  pg:
    # pgvector 扩展随镜像提供（ADR-04：向量检索与业务数据同库同事务）
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      # ⚠️ 角色与权限（app_rw / app_ro / append-only 触发器 / RLS 策略）**不在这里初始化**：
      #    它们必须随 alembic 迁移走版本管理（附录 D：RLS 策略也必须纳入迁移）。
      #    归 W1B。这里只保证实例起来。
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pgbouncer:
    # transaction 模式，default_pool_size=30（07 §16.3 连接池算数）
    # ⚠️ T-A1（20 并发压测确认 checkpoint 池行为）在阶段 1B 才做；
    #    若结论是"checkpoint 长持连接"，这里的分池与池大小**要改**（07 §16.3 的风险 1）。
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: pg
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ecom
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "30"
      MAX_CLIENT_CONN: "200"
      # ⚠️ 镜像默认听 **5432**，而下面的 ports 是 `6432:6432` ⇒ 不设这一行时
      #    宿主 6432 后面根本没有监听者，`pgbouncer:6432` 也连不上：
      #    这个服务自加入 compose 起就从未被真正用过（2026-09-19 起它才第一次能接上）。
      #    07 §16.3 的端口口径就是 6432，所以改监听端而不是改映射。
      LISTEN_PORT: "6432"
      # ⚠️ 刻意**不设** AUTH_TYPE：pgbouncer 没有 `scram` 这个取值（写了就 `invalid value for
      #    parameter auth_type` + FATAL cannot load config ⇒ 容器重启循环，2026-09-19 实测），
      #    而镜像默认的 `auth_query` 只能配 md5 哈希 —— W1B 的 0001 迁移建 app_rw/app_ro 时
      #    用的是 PG 默认 password_encryption=scram-sha-256，两侧对不上，
      #    表现为 `FATAL: server login failed: wrong password type`。
      #    ⇒ **§16.5 断言③（经 pgbouncer 的后端连接 ≤30）当前不可测**，
      #      三条出路各有代价，已上呈 RELAY：给这两个角色另存 md5（降安全）、
      #      或 userlist 里放专用口令、或 `auth_type=trust`（等于放弃容器网络内的口令校验）。
      #    在裁决前不要把应用 DSN 指到 6432。
    ports:
      - "6432:6432"
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 缓存 / 会话串行锁 / 限流 / 事件缓冲 —— 锁与限流属**安全边界**，
    # 故 Redis 是硬依赖：挂了要摘流量，而不是降级（附录 A §A.8.1）
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      # 容器内访问宿主 Ollama 的唯一可用地址（写 127.0.0.1 必然连不上）
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # §18.3 停机触发面的共享密钥（见文件头 ②：非 Settings 字段，故不在 .env.example）。
      # ⚠️ 留空**不是**"功能降级但仍可用"：`POST /healthz/drain` 一律 403（fail-closed），
      #    应用会在启动时打 `drain_trigger_unavailable` WARN。设置它 = 允许 pre-stop 摘流量。
      DRAIN_TOKEN: ${DRAIN_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 语义包只读挂载（W2-INT 转达的部署面缺口，2026-09-16 补）：
      # 不挂载则容器内 /semantic/bundle_*.yaml 永远不存在 → 语义包加载必失败、
      # readiness 持续 503。路径与 settings.SEMANTIC_BUNDLE_PATH 默认值对应；
      # 语义包升级（版本指针切换）只改宿主文件 + 重启 api，不改 compose。
      - ../semantic:/semantic:ro
      # 验签公钥只读挂载（W1B 转达，2026-09-18）：
      # 路径与 settings.JWT_PUBLIC_KEY_PATH 默认值（/run/secrets/jwt_public.pem）对应。
      # 不挂载则该路径不存在 → TokenVerifier 的 JWKS 源加载失败 → 认证链整条不可用；
      # 且每次重建容器都拿不到公钥，"签出的令牌跨重启即失效"。
      # ⚠️ 只挂**公钥**：私钥留在宿主 `deploy/secrets/`（已 gitignore），
      #    签发脚本（W1B）在宿主侧用它，容器永远不需要它。
      # ⚠️ 宿主文件不存在时 Docker 会在该路径**建一个同名目录**（不是报错）→
      #    应用侧表现为"读 PEM 失败"。首次使用前在宿主生成密钥对（幂等，已存在则复用）：
      #      cd backend && ../.venv/Scripts/python.exe scripts/mint_dev_token.py --tenant-id t_dev
      #    （`mint_dev_token.py` 私钥缺失时自动生成 RSA-2048 写 `deploy/secrets/jwt_private.pem`，
      #      并把公钥写 `deploy/secrets/jwt_public.pem`；两文件均不入库）
      # ✅ 有了此挂载，签发时**不再需要** `--docker-container`（原先靠 `docker cp` 拷公钥、
      #    容器非 root 还得 `-u root`，重启即丢）；现在公钥随挂载持久存在，跨重启不失效。
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ⚠️ 用 readiness 而不是 liveness：编排层要的是"能不能接流量"。
      #    用 liveness 会在依赖故障时触发重启 → **杀掉在途 SSE 流**（附录 A §A.8.2）。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Ollama 未预热时模型加载耗时较长（附录 D），故给较长的启动宽限
      start_period: 60s
    stop_grace_period: 40s   # 优雅停机需要 drain 在途 SSE ≤30s（07 §18.3）
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      api:
        # ⚠️ 刻意用 service_started（原注释留的"W7 收尾改成 service_healthy"，W7 判定**不改**）：
        #    这里要解决的是 nginx 在配置加载期解析 `proxy_pass http://api:8000` 的 DNS ——
        #    容器**存在**即可，不需要它健康。换成 `service_healthy` 后，readiness 一旦 503
        #    （元库/Redis/语义包任一硬依赖没就绪，阶段 1 之后这是**正常态**）nginx 就永远不起，
        #    用户看到的是"连接被拒绝"而不是 §A.8.4 要求的那个 `503 + checks{}` JSON ——
        #    把一个"看得见故障"的栈换成"看不见故障"的栈，是净损失。
        condition: service_started
    restart: unless-stopped

  worker:
    # ADR-15：P0 **保留定义不启用**（异步执行走 in-process + Redis 结果存储）
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    profiles: ["async"]
    depends_on:
      pg:
        condition: service_healthy

  # ==========================================================================
  # 观测栈（07 §15.4 告警规则 + §15.5 最小看板）—— **默认不起**，按需开：
  #   docker compose --profile observability up -d prometheus grafana
  #
  # 为什么放在 profile 里而不是主干：PRD A-7 是单机栈，而 W6 的门禁判定与日常联调
  # 都只依赖 api/web/pg/redis。多两个常驻进程 = 多两个"看起来在看数据其实没在采"的
  # 故障面（Prometheus 对加载不到的 rule_files 只在日志 WARN、不阻止启动）。
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    # ⚠️ 两个挂载路径就是 `observability/prometheus.yml` 文件头里声明的那两个：
    #    `rule_files` 用的是**绝对路径**（相对路径的解析基准是配置文件所在目录，
    #    换一种挂载布局就会静默变成"规则没加载"），所以这里的目标路径不能改。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d：单机栈的磁盘换不来更长回溯，而 §15.4 的周环比告警（准确率/token）要 7d 窗口
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/rules/alert.rules.yml:ro
      - prom_data:/prometheus
    ports:
      # 只绑宿主回环：/api/v1/metrics 在 nginx 侧已经封堵（`location = …{ return 404; }`），
      # 但 9090 上没有任何鉴权 —— 绑 0.0.0.0 等于把指标面重新对外打开。
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    volumes:
      # provisioning 的两个子目录名是 Grafana 硬编码的（datasources / dashboards），
      # 而仓库里的源目录叫 `datasource`（单数，与 §15.5 的文档结构对应）—— 挂载时改名。
      - ./observability/grafana/datasource:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provider.dashboards.yml:/etc/grafana/provisioning/dashboards/provider.dashboards.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # 刻意**不设**管理员口令：口令进不了 `.env.example`（见文件头 ②），写死在受版本
      # 管理的文件里更糟。默认 admin/admin + 只绑回环，够本机看板用；
      # ⚠️ 任何"对外网/内网开放 3000"的改动都必须先改口令 —— 这一条写在 runbook 里。
      GF_SERVER_HTTP_ADDR: 0.0.0.0    # 容器内要听 0.0.0.0，否则宿主映射打不进去
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  # 观测栈的数据卷与业务无关，删掉不丢任何审计/任务记录
  prom_data:
  grafana_data:
  pg_data:
    # ⚠️ Docker 数据已迁到非 C 盘（E:\DockerData\DockerDesktopWSL），C 盘剩余空间紧张，
    #    不得把卷改回 C 盘（附录 D §D.1.3.1 分盘核算）
