# ============================================================================
# Alembic config -- the ONLY channel for role / privilege / table changes (07 12.6)
# Owner window: W1B (docs/08 4.1: `app/repo/**`, including migrations).
#
# !! THIS FILE MUST STAY PURE ASCII !!
#   Reason (measured 2026-09-15): alembic reads this file with
#   `configparser.read(..., encoding="locale")`. On a zh-CN Windows host the
#   locale encoding is GBK, so any non-ASCII byte here raises
#   `UnicodeDecodeError: 'gbk' codec can't decode byte 0x80` BEFORE any code runs.
#   There is no config knob for it in alembic 1.20.
#   -> Long explanations live in `app/repo/migrations/env.py` (read as UTF-8).
#
# Two hard rules from 07 12.6 are NOT enforced here but in the migration files:
#   * write `upgrade()` only, never `downgrade()` (rollback relies on
#     backward-compatible releases, not on downgrade);
#   * indexes use `CREATE INDEX CONCURRENTLY`, which cannot run inside a
#     transaction -> such steps need their own file plus a
#     `transaction_per_migration` exception.
#
# Migration connection must be an owner/superuser, and it comes ONLY from the
# `MIGRATION_DATABASE_URL` environment variable -- never from this file.
# Long explanations live in `app/repo/migrations/env.py` (read as UTF-8).
# Why not `DATABASE_URL`: the runtime role `app_rw` intentionally lacks
# CREATEROLE, and migration 0001 creates roles + grants.
#
# !! THIS FILE DELIBERATELY HOLDS NO DEFAULT DSN !!  (removed 2026-09-16)
#   1. Any literal here would put a *usable* credential into a version-controlled
#      file. The CI secret scan (DoD4, gitleaks rule "commerceql-dsn-with-password"
#      in .gitleaks.toml) rejects that, and allowlisting it would only legalise
#      the credential -- i.e. switch that gate off.
#   2. A default is also actively harmful: if the operator forgets to set the
#      variable, the migration would silently target *some* database -- and
#      CREATE ROLE / GRANT cannot be un-done. Failing to run beats that.
#   -> Supply it via the environment, or via `deploy/.env` (gitignored) which you
#      load into the shell before running alembic.
#      Commands that need no DSN (`alembic history`, `alembic heads`) still work.
# ============================================================================

[alembic]
script_location = app/repo/migrations
prepend_sys_path = .
# NOTE: the custom key `migration_url` used to live here and held a literal DSN.
# It was deleted (not blanked) on 2026-09-16 together with its only reader in
# env.py -- a key nobody consumes is how "listed but never defined" problems start.
transaction_per_migration = true
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# Intentionally empty: the real value is injected by env.py. Alembic requires the key.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
