  - case_id: g09
    question: "各州的配送延迟率是多少？"
    expected_behavior: execute
    eval_tenant: T_A
    domain: orders
    metrics: ["delivery_late_rate"]
    assets: ["order"]
    gold_sql: |
      SELECT o.customer_state AS state,
               SUM(CASE WHEN o.order_delivered_customer_date > o.order_estimated_delivery_date
                        THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0) AS delivery_late_rate
      FROM v_o_orders AS o
      WHERE o.order_status = 'delivered'
        AND o.order_delivered_customer_date IS NOT NULL
        AND o.order_estimated_delivery_date IS NOT NULL
      GROUP BY o.customer_state
      ORDER BY delivery_late_rate DESC
    expect:
      time_column: "order_purchase_timestamp"
      time_filtered: false
      amount_column: null
      status_mode: "require"
      status_values: ["delivered"]
    clarify_expected: null
    refuse_reason: null
    business_knowledge_required: []
    must_contain: []
    must_not_contain: []
    caliber_note: "分母 = delivered 且两个日期列均非空（96,470）；全量口径 7,826/96,470 = 8.112%。"

