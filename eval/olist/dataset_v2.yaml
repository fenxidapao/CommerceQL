# W2 Olist 评测集（60 题：55 execute / 3 clarify / 2 refuse）
#
# 归属窗口：W2 实施窗（docs/07 §4.8 的 U-144）。
# g01..g10 = W1 原样承接（question/gold_sql/metrics/assets/expect 逐字不变）；
# o01..o45 = W2 新增；c01..c03 / r01..r02 = 交互题。
# 难度标签不写在这里：加载时由 layering.annotate_case 机器计算。
# 两个 stamp 由 `python eval/olist/build_dataset.py --stamp` 维护。
#
# content_hash: sha256:beceddbc92f474aa2d1f22949839314b2181626ac04c29c90943c99382a4685f
# full_hash: sha256:1a0c58cc3464f1d3c1fbd5299c75d004d72542bbfadc1c800969e664a124f29a
dataset: olist_v2
bundle: semantic/bundle_olist_2018_v2.yaml
tenant: T_A

cases:

  # ======================= W1 原样承接（10） =======================

  - case_id: g01
    question: "2018 年的 GMV 是多少？"
    expected_behavior: execute
    eval_tenant: T_A
    domain: orders
    metrics: ["gmv"]
    assets: ["order", "payment"]
    gold_sql: |
      SELECT SUM(p.payment_value) AS gmv
      FROM v_o_payments AS p
      JOIN v_o_orders AS o ON o.order_id = p.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2018-01-01'
        AND o.order_purchase_timestamp <  '2019-01-01'
    expect:
      time_column: "order_purchase_timestamp"
      time_filtered: true
      amount_column: "payment_value"
      status_mode: "exclude"
      status_values: ["canceled", "unavailable"]
    clarify_expected: null
    refuse_reason: null
    business_knowledge_required: []
    must_contain: []
    must_not_contain: []
    caliber_note: "GMV = 支付表金额求和（含运费），剔除取消/不可用单，按订单创建时间归属。"

  - case_id: g02
    question: "2017 年每个月的订单量是多少？"
    expected_behavior: execute
    eval_tenant: T_A
    domain: orders
    metrics: ["order_cnt"]
    assets: ["order"]
    gold_sql: |
      SELECT STRFTIME('%Y-%m', o.order_purchase_timestamp) AS month,
             COUNT(DISTINCT o.order_id) AS order_cnt
      FROM v_o_orders AS o
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2017-01-01'
        AND o.order_purchase_timestamp <  '2018-01-01'
      GROUP BY month
      ORDER BY month
    expect:
      time_column: "order_purchase_timestamp"
      time_filtered: true
      amount_column: null
      status_mode: "exclude"
      status_values: ["canceled", "unavailable"]
    clarify_expected: null
    refuse_reason: null
    business_knowledge_required: []
    must_contain: []
    must_not_contain: []
    caliber_note: "订单量用 DISTINCT order_id；多支付行不会放大计数。"

  - case_id: g03
    question: "各州 GMV 前十名是哪些？"
    expected_behavior: execute
    eval_tenant: T_A
    domain: orders
    metrics: ["gmv"]
    assets: ["order", "payment"]
    gold_sql: |
      SELECT o.customer_state AS state,
             SUM(p.payment_value) AS gmv
      FROM v_o_payments AS p
      JOIN v_o_orders AS o ON o.order_id = p.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY o.customer_state
      ORDER BY gmv DESC
      LIMIT 10
    expect:
      time_column: "order_purchase_timestamp"
      time_filtered: false
      amount_column: "payment_value"
      status_mode: "exclude"
      status_values: ["canceled", "unavailable"]
    clarify_expected: null
    refuse_reason: null
    business_knowledge_required: []
    must_contain: []
    must_not_contain: []
    caliber_note: "全期间口径；州取收货州（订单侧唯一州字段）。"

  - case_id: g04
    question: "各品类商品销售额（不含运费）前十名是哪些？"
    expected_behavior: execute
    eval_tenant: T_A
    domain: orders
    metrics: ["item_gmv"]
    assets: ["order", "order_item", "product"]
    gold_sql: |
      SELECT pr.product_category AS category,
             SUM(i.price) AS item_gmv
      FROM v_o_order_items AS i
      JOIN v_o_orders AS o   ON o.order_id = i.order_id
      JOIN v_o_products AS pr ON pr.product_id = i.product_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY pr.product_category
      ORDER BY item_gmv DESC
      LIMIT 10
    expect:
      time_column: "order_purchase_timestamp"
      time_filtered: false
      amount_column: "price"
      status_mode: "exclude"
      status_values: ["canceled", "unavailable"]
    clarify_expected: null
    refuse_reason: null
    business_knowledge_required: []
    must_contain: []
    must_not_contain: []
    caliber_note: "商品销售额只算 price，不含 freight_value；无品类译名的商品落空值组（报告里记录其排名）。"

